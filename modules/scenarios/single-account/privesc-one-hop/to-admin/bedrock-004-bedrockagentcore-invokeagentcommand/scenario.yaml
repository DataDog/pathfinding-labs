# =============================================================================
# CORE METADATA
# =============================================================================
schema_version: "1.8.0"
name: "bedrockagentcore-invokeagentcommand"
title: "AgentCore Runtime Command Injection to Admin"
description: "Principal with bedrock-agentcore:InvokeAgentRuntimeCommand can run root shell commands inside an existing Runtime or Harness microVM and extract its execution role credentials from MMDS"
cost_estimate: "$0/mo"
cost_estimate_when_demo_executed: "$0/mo"
pathfinding-cloud-id: "bedrock-004"

# =============================================================================
# CLASSIFICATION
# =============================================================================
category: "Privilege Escalation"
sub_category: "existing-passrole"
path_type: "one-hop"
target: "to-admin"
environments:
  - "prod"

# =============================================================================
# ATTACK PATH
# =============================================================================
attack_path:
  principals:
    - "arn:aws:iam::{account_id}:user/pl-prod-bedrock-004-to-admin-starting-user"
    - "arn:aws:iam::{account_id}:role/pl-prod-bedrock-004-to-admin-target-role"

  summary: "starting_user → InvokeAgentRuntimeCommand on existing Runtime with admin execution role → read MMDS credentials at 169.254.169.254 → admin access"

# =============================================================================
# REQUIRED PRECONDITIONS
# =============================================================================
required_preconditions:
  - type: "aws-resource"
    resource: "IAM Role"
    description: "with administrative privileges that trusts bedrock-agentcore.amazonaws.com as a service principal"
  - type: "aws-resource"
    resource: "AgentCore Runtime"
    description: "with the admin execution role attached, using IAM as its Inbound Auth type (not JWT), in READY state"

# =============================================================================
# PERMISSIONS
# =============================================================================
permissions:
  required:
    - principal: "pl-prod-bedrock-004-to-admin-starting-user"
      principal_type: "user"
      permissions:
        - permission: "bedrock-agentcore:InvokeAgentRuntimeCommand"
          resource: "*"

  helpful:
    - principal: "pl-prod-bedrock-004-to-admin-starting-user"
      principal_type: "user"
      permissions:
        - permission: "bedrock-agentcore:ListAgentRuntimes"
          purpose: "Discover existing runtimes to target"
        - permission: "bedrock-agentcore:GetAgentRuntime"
          purpose: "Confirm execution role ARN and Inbound Auth type of the target runtime"

# =============================================================================
# MITRE ATT&CK
# =============================================================================
mitre_attack:
  tactics:
    - "TA0004 - Privilege Escalation"
    - "TA0006 - Credential Access"
  techniques:
    - "T1078.004 - Valid Accounts: Cloud Accounts"
    - "T1552.005 - Unsecured Credentials: Cloud Instance Metadata API"

# =============================================================================
# TERRAFORM
# =============================================================================
terraform:
  variable_name: "enable_single_account_privesc_one_hop_to_admin_bedrock_004_bedrockagentcore_invokeagentcommand"
  module_path: "modules/scenarios/single-account/privesc-one-hop/to-admin/bedrock-004-bedrockagentcore-invokeagentcommand"
