# =============================================================================
# CORE METADATA
# =============================================================================
schema_version: "1.8.0"
name: "iam-passrole+batch-createcomputeenvironment+batch-createjobqueue+batch-registerjobdefinition+batch-submitjob"
title: "AWS Batch Full Pipeline Creation to Admin"
description: "User with iam:PassRole and broad Batch permissions creates entire Batch pipeline from scratch — compute environment, job queue, job definition with admin jobRoleArn — and submits a job to escalate to admin"
cost_estimate: "$0/mo"
cost_estimate_when_demo_executed: "$0/mo"
pathfinding-cloud-id: "batch-003"
demo_timeout_seconds: 600
cleanup_timeout_seconds: 180

# =============================================================================
# CLASSIFICATION
# =============================================================================
category: "Privilege Escalation"
sub_category: "new-passrole"
path_type: "one-hop"
target: "to-admin"
environments:
  - "prod"

# =============================================================================
# REQUIRED PRECONDITIONS
# =============================================================================
required_preconditions:
  - type: "aws-resource"
    resource: "IAM Role"
    description: "with administrative privileges that trusts ecs-tasks.amazonaws.com, allowing it to be passed as jobRoleArn to Batch job definitions"
  - type: "aws-resource"
    resource: "IAM Role"
    description: "ECS task execution role trusting ecs-tasks.amazonaws.com with AmazonECSTaskExecutionRolePolicy, required for Fargate to pull container images"
  - type: "network"
    description: "VPC subnet with internet access (public subnet or NAT gateway) for Fargate tasks to pull container images and make AWS API calls"

# =============================================================================
# ATTACK PATH
# =============================================================================
attack_path:
  principals:
    - "arn:aws:iam::{account_id}:user/pl-prod-batch-003-to-admin-starting-user"
    - "arn:aws:iam::{account_id}:role/pl-prod-batch-003-to-admin-admin-role"

  summary: "starting_user → (batch:CreateComputeEnvironment + iam:PassRole) → (batch:CreateJobQueue) → (batch:RegisterJobDefinition with admin role as jobRoleArn) → (batch:SubmitJob) → Batch job container attaches admin policy to starting user → admin access"

# =============================================================================
# PERMISSIONS
# =============================================================================
permissions:
  required:
    - principal: "pl-prod-batch-003-to-admin-starting-user"
      principal_type: "user"
      permissions:
        - permission: "iam:PassRole"
          resource: "arn:aws:iam::*:role/pl-prod-batch-003-to-admin-admin-role"
        - permission: "iam:PassRole"
          resource: "arn:aws:iam::*:role/pl-prod-batch-003-to-admin-execution-role"
        - permission: "batch:CreateComputeEnvironment"
          resource: "*"
        - permission: "batch:CreateJobQueue"
          resource: "*"
        - permission: "batch:RegisterJobDefinition"
          resource: "*"
        - permission: "batch:SubmitJob"
          resource: "*"

  helpful:
    - principal: "pl-prod-batch-003-to-admin-starting-user"
      principal_type: "user"
      permissions:
        - permission: "batch:DescribeComputeEnvironments"
          purpose: "Monitor compute environment status during creation"
        - permission: "batch:DescribeJobQueues"
          purpose: "Verify job queue creation and state"
        - permission: "batch:DescribeJobs"
          purpose: "Monitor job execution status and verify job completion"
        - permission: "batch:DescribeJobDefinitions"
          purpose: "Verify job definition registration"
        - permission: "iam:ListAttachedUserPolicies"
          purpose: "Verify privilege escalation success by listing attached policies"
        - permission: "iam:ListRoles"
          purpose: "Discover IAM roles in the account to identify passable admin and execution roles"
        - permission: "ec2:DescribeSubnets"
          purpose: "Discover available VPC subnets for the Fargate compute environment"
        - permission: "ec2:DescribeSecurityGroups"
          purpose: "Discover available security groups for the Fargate compute environment"

# =============================================================================
# MITRE ATT&CK
# =============================================================================
mitre_attack:
  tactics:
    - "TA0004 - Privilege Escalation"
    - "TA0002 - Execution"
  techniques:
    - "T1078.004 - Valid Accounts: Cloud Accounts"
    - "T1610 - Deploy Container"

# =============================================================================
# TERRAFORM
# =============================================================================
terraform:
  variable_name: "enable_single_account_privesc_one_hop_to_admin_batch_003_iam_passrole_batch_createcomputeenvironment_batch_createjobqueue_batch_registerjobdefinition_batch_submitjob"
  module_path: "modules/scenarios/single-account/privesc-one-hop/to-admin/batch-003-iam-passrole+batch-createcomputeenvironment+batch-createjobqueue+batch-registerjobdefinition+batch-submitjob"
