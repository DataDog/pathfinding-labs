# =============================================================================
# CORE METADATA
# =============================================================================
schema_version: "1.2.0"
name: "iam-passrole+synthetics-createcanary+synthetics-startcanary"
description: "User with iam:PassRole, synthetics:CreateCanary, and synthetics:StartCanary can escalate privileges by creating a CloudWatch Synthetics canary with malicious code and an admin execution role that grants starting user admin access"
cost_estimate: "$0/mo"
pathfinding-cloud-id: "synthetics-001"

# =============================================================================
# CLASSIFICATION
# =============================================================================
category: "Privilege Escalation"
sub_category: "new-passrole"
path_type: "one-hop"
target: "to-admin"
environments:
  - "prod"

# =============================================================================
# ATTACK PATH
# =============================================================================
attack_path:
  principals:
    - "arn:aws:iam::{account_id}:user/pl-prod-synthetics-001-to-admin-starting-user"
    - "arn:aws:iam::{account_id}:role/pl-prod-synthetics-001-to-admin-admin-role"

  summary: "starting_user → (synthetics:CreateCanary with inline malicious Python code and admin execution role) → (synthetics:StartCanary) → canary Lambda function attaches AdministratorAccess to starting user → admin access"

# =============================================================================
# PERMISSIONS
# =============================================================================
permissions:
  required:
    - permission: "iam:PassRole"
      resource: "arn:aws:iam::*:role/pl-prod-synthetics-001-to-admin-admin-role"

    - permission: "synthetics:CreateCanary"
      resource: "*"

    - permission: "synthetics:StartCanary"
      resource: "*"

  helpful:
    - permission: "lambda:CreateFunction"
      purpose: "Required by Synthetics service for creating the underlying Lambda (scoped to cwsyn-*)"

    - permission: "lambda:GetFunction"
      purpose: "Required by Synthetics service to check Lambda function state"

    - permission: "lambda:PublishVersion"
      purpose: "Required by Synthetics service to publish Lambda version"

    - permission: "lambda:UpdateFunctionCode"
      purpose: "May be needed during canary creation flow"

    - permission: "lambda:UpdateFunctionConfiguration"
      purpose: "May be needed during canary creation flow"

    - permission: "lambda:GetFunctionConfiguration"
      purpose: "Required by Synthetics service to check configuration"

    - permission: "lambda:AddPermission"
      purpose: "Required by Synthetics service to add invocation permission"

    - permission: "lambda:GetLayerVersion"
      purpose: "Required by Synthetics service to attach runtime layer"

    - permission: "s3:CreateBucket"
      purpose: "Create artifact bucket if cw-syn-results bucket does not exist"

    - permission: "s3:PutEncryptionConfiguration"
      purpose: "Configure encryption on artifact bucket"

    - permission: "s3:GetBucketLocation"
      purpose: "Required to locate the canary artifact bucket"

    - permission: "s3:ListAllMyBuckets"
      purpose: "Required to check if the cw-syn-results bucket already exists"

    - permission: "s3:PutObject"
      purpose: "Required to write canary run artifacts to S3"

    - permission: "s3:GetObject"
      purpose: "Required to read canary artifacts from S3"

    - permission: "sts:GetCallerIdentity"
      purpose: "Identify the current caller to determine which user to escalate"

    - permission: "synthetics:GetCanary"
      purpose: "Check canary status after creation"

    - permission: "synthetics:GetCanaryRuns"
      purpose: "Verify the canary ran successfully"

    - permission: "synthetics:DeleteCanary"
      purpose: "Clean up canary after demonstration"

    - permission: "iam:DetachUserPolicy"
      purpose: "Remove admin policy from starting user during cleanup"

    - permission: "iam:ListAttachedUserPolicies"
      purpose: "Verify privilege escalation success by listing attached policies"

# =============================================================================
# MITRE ATT&CK
# =============================================================================
mitre_attack:
  tactics:
    - "TA0004 - Privilege Escalation"
    - "TA0002 - Execution"
  techniques:
    - "T1078.004 - Valid Accounts: Cloud Accounts"

# =============================================================================
# TERRAFORM
# =============================================================================
terraform:
  variable_name: "enable_single_account_privesc_one_hop_to_admin_synthetics_001_iam_passrole_synthetics_createcanary_synthetics_startcanary"
  module_path: "modules/scenarios/single-account/privesc-one-hop/to-admin/synthetics-001-iam-passrole+synthetics-createcanary+synthetics-startcanary"
