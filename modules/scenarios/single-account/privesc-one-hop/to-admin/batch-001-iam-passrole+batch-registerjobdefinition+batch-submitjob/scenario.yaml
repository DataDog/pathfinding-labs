# =============================================================================
# CORE METADATA
# =============================================================================
schema_version: "1.2.1"
name: "iam-passrole+batch-registerjobdefinition+batch-submitjob"
description: "User with iam:PassRole, batch:RegisterJobDefinition, and batch:SubmitJob can escalate privileges by launching a Batch job with an admin role that grants starting user admin access"
cost_estimate: "$0/mo"
pathfinding-cloud-id: "batch-001"

# =============================================================================
# CLASSIFICATION
# =============================================================================
category: "Privilege Escalation"
sub_category: "new-passrole"
path_type: "one-hop"
target: "to-admin"
environments:
  - "prod"

# =============================================================================
# ATTACK PATH
# =============================================================================
attack_path:
  principals:
    - "arn:aws:iam::{account_id}:user/pl-prod-batch-001-to-admin-starting-user"
    - "arn:aws:iam::{account_id}:role/pl-prod-batch-001-to-admin-admin-role"

  summary: "starting_user → (batch:RegisterJobDefinition with admin role as jobRoleArn) → (batch:SubmitJob) → Batch job container attaches admin policy to starting user → admin access"

# =============================================================================
# PERMISSIONS
# =============================================================================
permissions:
  required:
    - permission: "iam:PassRole"
      resource: "arn:aws:iam::*:role/pl-prod-batch-001-to-admin-admin-role and arn:aws:iam::*:role/pl-prod-batch-001-to-admin-execution-role"

    - permission: "batch:RegisterJobDefinition"
      resource: "*"

    - permission: "batch:SubmitJob"
      resource: "*"

  helpful:
    - permission: "batch:DescribeJobs"
      purpose: "Monitor job execution status and verify job completion"

    - permission: "batch:DescribeJobQueues"
      purpose: "Discover existing job queues for job submission"

    - permission: "batch:DescribeComputeEnvironments"
      purpose: "Discover existing compute environments"

    - permission: "batch:DeregisterJobDefinition"
      purpose: "Clean up job definition after demonstration"

    - permission: "iam:DetachUserPolicy"
      purpose: "Remove admin policy from starting user during cleanup"

    - permission: "iam:ListAttachedUserPolicies"
      purpose: "Verify privilege escalation success by listing attached policies"

# =============================================================================
# MITRE ATT&CK
# =============================================================================
mitre_attack:
  tactics:
    - "TA0004 - Privilege Escalation"
    - "TA0002 - Execution"
  techniques:
    - "T1078.004 - Valid Accounts: Cloud Accounts"
    - "T1610 - Deploy Container"

# =============================================================================
# TERRAFORM
# =============================================================================
terraform:
  variable_name: "enable_single_account_privesc_one_hop_to_admin_batch_001_iam_passrole_batch_registerjobdefinition_batch_submitjob"
  module_path: "modules/scenarios/single-account/privesc-one-hop/to-admin/batch-001-iam-passrole+batch-registerjobdefinition+batch-submitjob"
