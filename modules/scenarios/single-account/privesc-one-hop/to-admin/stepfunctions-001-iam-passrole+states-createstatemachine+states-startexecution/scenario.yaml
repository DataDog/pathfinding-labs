# =============================================================================
# CORE METADATA
# =============================================================================
schema_version: "1.2.1"
name: "iam-passrole+states-createstatemachine+states-startexecution"
title: "Step Functions State Machine Execution to Admin"
description: "User with iam:PassRole, states:CreateStateMachine, and states:StartExecution can escalate privileges by creating a Step Functions state machine that calls IAM APIs with an admin role"
cost_estimate: "$0/mo"
cost_estimate_when_demo_executed: "$0/mo"
pathfinding-cloud-id: "stepfunctions-001"

# =============================================================================
# CLASSIFICATION
# =============================================================================
category: "Privilege Escalation"
sub_category: "new-passrole"
path_type: "one-hop"
target: "to-admin"
environments:
  - "prod"

# =============================================================================
# ATTACK PATH
# =============================================================================
attack_path:
  principals:
    - "arn:aws:iam::{account_id}:user/pl-prod-stepfunctions-001-to-admin-starting-user"
    - "arn:aws:iam::{account_id}:role/pl-prod-stepfunctions-001-to-admin-admin-role"

  summary: "starting_user → (states:CreateStateMachine with admin role, definition calls iam:attachUserPolicy) → (states:StartExecution) → state machine attaches AdministratorAccess to starting user → admin access"

# =============================================================================
# PERMISSIONS
# =============================================================================
permissions:
  required:
    - principal: "pl-prod-stepfunctions-001-to-admin-starting-user"
      principal_type: "user"
      permissions:
        - permission: "iam:PassRole"
          resource: "arn:aws:iam::*:role/pl-prod-stepfunctions-001-to-admin-admin-role"
        - permission: "states:CreateStateMachine"
          resource: "*"
        - permission: "states:StartExecution"
          resource: "*"

  helpful:
    - principal: "pl-prod-stepfunctions-001-to-admin-starting-user"
      principal_type: "user"
      permissions:
        - permission: "states:DescribeExecution"
          purpose: "Poll execution status to verify the state machine completed successfully"
        - permission: "states:DescribeStateMachine"
          purpose: "Verify the state machine was created with the correct definition and role"
        - permission: "iam:ListAttachedUserPolicies"
          purpose: "Verify privilege escalation success by listing attached policies on the starting user"

# =============================================================================
# MITRE ATT&CK
# =============================================================================
mitre_attack:
  tactics:
    - "TA0004 - Privilege Escalation"
    - "TA0002 - Execution"
  techniques:
    - "T1078.004 - Valid Accounts: Cloud Accounts"

# =============================================================================
# TERRAFORM
# =============================================================================
terraform:
  variable_name: "enable_single_account_privesc_one_hop_to_admin_stepfunctions_001_iam_passrole_states_createstatemachine_states_startexecution"
  module_path: "modules/scenarios/single-account/privesc-one-hop/to-admin/stepfunctions-001-iam-passrole+states-createstatemachine+states-startexecution"
