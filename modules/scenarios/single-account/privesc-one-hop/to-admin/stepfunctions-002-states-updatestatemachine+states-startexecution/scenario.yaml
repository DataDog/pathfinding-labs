schema_version: "1.8.0"
name: "stepfunctions-002-states-updatestatemachine+states-startexecution"
title: "UpdateStateMachine + StartExecution on Existing Admin-Role State Machine"
description: "Principal with states:UpdateStateMachine and states:StartExecution can replace an existing state machine's definition with malicious ASL that runs under the machine's pre-existing admin role — no iam:PassRole required"
cost_estimate: "$0/mo"
cost_estimate_when_demo_executed: "$0/mo"
pathfinding-cloud-id: "stepfunctions-002"

category: "Privilege Escalation"
sub_category: "existing-passrole"
path_type: "one-hop"
target: "to-admin"
environments:
  - "prod"

attack_path:
  principals:
    - "arn:aws:iam::{account_id}:user/pl-prod-stepfunctions-002-to-admin-starting-user"
    - "arn:aws:states:{region}:{account_id}:stateMachine/pl-prod-stepfunctions-002-to-admin-statemachine"
    - "arn:aws:iam::{account_id}:role/pl-prod-stepfunctions-002-to-admin-statemachine-role"
  summary: "starting_user → (states:UpdateStateMachine) → replaces benign definition with malicious ASL → (states:StartExecution) → state machine runs as existing admin role → attaches AdministratorAccess to starting_user → admin access"

required_preconditions:
  - type: "aws-resource"
    resource: "Step Functions State Machine"
    description: "with an admin-equivalent IAM execution role already attached (UpdateStateMachine without changing roleArn does not trigger iam:PassRole)"

permissions:
  required:
    - principal: "pl-prod-stepfunctions-002-to-admin-starting-user"
      principal_type: "user"
      permissions:
        - permission: "states:UpdateStateMachine"
          resource: "arn:aws:states:*:*:stateMachine:pl-prod-stepfunctions-002-to-admin-statemachine"
        - permission: "states:StartExecution"
          resource: "arn:aws:states:*:*:stateMachine:pl-prod-stepfunctions-002-to-admin-statemachine"
  helpful:
    - principal: "pl-prod-stepfunctions-002-to-admin-starting-user"
      principal_type: "user"
      permissions:
        - permission: "states:ListStateMachines"
          purpose: "Discover existing state machines in the account"
        - permission: "states:DescribeStateMachine"
          purpose: "Inspect the state machine's current definition and role ARN"
        - permission: "states:ListExecutions"
          purpose: "Monitor execution status after StartExecution"
        - permission: "states:DescribeExecution"
          purpose: "Check whether the execution succeeded and AdministratorAccess was attached"

mitre_attack:
  tactics:
    - "TA0004 - Privilege Escalation"
  techniques:
    - "T1098 - Account Manipulation"
    - "T1578 - Modify Cloud Compute Infrastructure"

terraform:
  variable_name: "enable_single_account_privesc_one_hop_to_admin_stepfunctions_002_states_updatestatemachine_states_startexecution"
  module_path: "modules/scenarios/single-account/privesc-one-hop/to-admin/stepfunctions-002-states-updatestatemachine+states-startexecution"
