# =============================================================================
# CORE METADATA
# =============================================================================
schema_version: "1.8.0"
name: "bedrockagentcore-startbrowsersession+cdp"
title: "AgentCore Custom Browser CDP Credential Theft to Admin"
description: "Principal with bedrock-agentcore:StartBrowserSession and ConnectBrowserAutomationStream can drive an existing Custom Browser over CDP to read its execution role credentials from MMDS"
cost_estimate: "$0/mo"
cost_estimate_when_demo_executed: "$0/mo"
pathfinding-cloud-id: "bedrock-007"

# =============================================================================
# CLASSIFICATION
# =============================================================================
category: "Privilege Escalation"
sub_category: "existing-passrole"
path_type: "one-hop"
target: "to-admin"
environments:
  - "prod"

# =============================================================================
# ATTACK PATH
# =============================================================================
attack_path:
  principals:
    - "arn:aws:iam::{account_id}:user/pl-prod-bedrock-007-to-admin-starting-user"
    - "arn:aws:iam::{account_id}:role/pl-prod-bedrock-007-to-admin-target-role"

  summary: "starting_user → (StartBrowserSession + ConnectBrowserAutomationStream) on existing Custom Browser with admin execution role → CDP/Playwright context.route hook rewrites MMDS token request → read execution role credentials at 169.254.169.254 → admin access"

# =============================================================================
# REQUIRED PRECONDITIONS
# =============================================================================
required_preconditions:
  - type: "aws-resource"
    resource: "IAM Role"
    description: "with administrative privileges that trusts bedrock-agentcore.amazonaws.com as a service principal"
  - type: "aws-resource"
    resource: "AgentCore Custom Browser"
    description: "with an execution role explicitly attached (role is optional at browser creation — only browsers provisioned with one are vulnerable to this path)"

# =============================================================================
# PERMISSIONS
# =============================================================================
permissions:
  required:
    - principal: "pl-prod-bedrock-007-to-admin-starting-user"
      principal_type: "user"
      permissions:
        - permission: "bedrock-agentcore:StartBrowserSession"
          resource: "*"
        - permission: "bedrock-agentcore:ConnectBrowserAutomationStream"
          resource: "*"

  helpful:
    - principal: "pl-prod-bedrock-007-to-admin-starting-user"
      principal_type: "user"
      permissions:
        - permission: "bedrock-agentcore:ListBrowsers"
          purpose: "Discover existing Custom Browsers to target"
        - permission: "bedrock-agentcore:GetBrowser"
          purpose: "Confirm execution role is attached to the target browser"

# =============================================================================
# MITRE ATT&CK
# =============================================================================
mitre_attack:
  tactics:
    - "TA0004 - Privilege Escalation"
    - "TA0006 - Credential Access"
  techniques:
    - "T1078.004 - Valid Accounts: Cloud Accounts"
    - "T1552.005 - Unsecured Credentials: Cloud Instance Metadata API"

# =============================================================================
# TERRAFORM
# =============================================================================
terraform:
  variable_name: "enable_single_account_privesc_one_hop_to_admin_bedrock_007_bedrockagentcore_startbrowsersession_cdp"
  module_path: "modules/scenarios/single-account/privesc-one-hop/to-admin/bedrock-007-bedrockagentcore-startbrowsersession+cdp"
