schema_version: "1.8.0"
name: "cognito-identity-001-iam-passrole+cognito-identity-setidentitypoolroles"
title: "PassRole + Cognito Identity Pool: Unauthenticated Role Swap"
description: "Principal with iam:PassRole and cognito-identity:SetIdentityPoolRoles can bind an admin role to an existing pool's unauthenticated slot, turning it into a public STS credential-vending endpoint"
cost_estimate: "$0/mo"
cost_estimate_when_demo_executed: "$0/mo"
pathfinding-cloud-id: "cognitoidentity-001"

category: "Privilege Escalation"
sub_category: "new-passrole"
path_type: "one-hop"
target: "to-admin"
environments:
  - "prod"

attack_path:
  principals:
    - "arn:aws:iam::{account_id}:user/pl-prod-cognito-identity-001-to-admin-starting-user"
    - "arn:aws:cognito-identity:{region}:{account_id}:identitypool/{pool_id}"
    - "arn:aws:iam::{account_id}:role/pl-prod-cognito-identity-001-to-admin-admin-role"
  summary: "starting_user → (iam:PassRole + cognito-identity:SetIdentityPoolRoles) → binds admin role to pool unauthenticated slot → public caller (GetId + GetOpenIdToken + sts:AssumeRoleWithWebIdentity) → admin_role credentials → admin access"

required_preconditions:
  - type: "aws-resource"
    resource: "Cognito Identity Pool"
    description: "with AllowUnauthenticatedIdentities=true and AllowClassicFlow=true (models a mobile app's guest access tier)"
  - type: "aws-resource"
    resource: "IAM Role"
    description: "with AdministratorAccess and a trust policy scoped to cognito-identity.amazonaws.com with the pool ID in the aud condition"

permissions:
  required:
    - principal: "pl-prod-cognito-identity-001-to-admin-starting-user"
      principal_type: "user"
      permissions:
        - permission: "iam:PassRole"
          resource: "arn:aws:iam::*:role/pl-prod-cognito-identity-001-to-admin-admin-role"
        - permission: "cognito-identity:SetIdentityPoolRoles"
          resource: "*"
  helpful:
    - principal: "pl-prod-cognito-identity-001-to-admin-starting-user"
      principal_type: "user"
      permissions:
        - permission: "cognito-identity:ListIdentityPools"
          purpose: "Discover existing Cognito identity pools in the account"
        - permission: "cognito-identity:DescribeIdentityPool"
          purpose: "View pool configuration including unauthenticated access settings and classic flow"
        - permission: "cognito-identity:GetIdentityPoolRoles"
          purpose: "Check whether a privileged role is already bound to the pool's unauthenticated slot"
        - permission: "iam:ListRoles"
          purpose: "Discover available IAM roles to pass to the pool"
        - permission: "iam:GetRole"
          purpose: "Inspect role trust policies to find roles trusting cognito-identity.amazonaws.com"

mitre_attack:
  tactics:
    - "TA0004 - Privilege Escalation"
  techniques:
    - "T1098 - Account Manipulation"
    - "T1078.004 - Cloud Accounts"

terraform:
  variable_name: "enable_single_account_privesc_one_hop_to_admin_cognito_identity_001_iam_passrole_cognito_identity_setidentitypoolroles"
  module_path: "modules/scenarios/single-account/privesc-one-hop/to-admin/cognito-identity-001-iam-passrole+cognito-identity-setidentitypoolroles"
