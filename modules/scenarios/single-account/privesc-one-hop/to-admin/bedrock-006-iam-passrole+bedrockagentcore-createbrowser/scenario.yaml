# =============================================================================
# CORE METADATA
# =============================================================================
schema_version: "1.8.0"
name: "iam-passrole+bedrockagentcore-createbrowser"
title: "AgentCore Custom Browser Creation to Admin"
description: "Principal with iam:PassRole and AgentCore Browser create/session permissions can create a Custom Browser with a privileged execution role and extract credentials from MMDS via CDP"
cost_estimate: "$0/mo"
cost_estimate_when_demo_executed: "$0/mo"
pathfinding-cloud-id: "bedrock-006"
demo_timeout_seconds: 600

# =============================================================================
# CLASSIFICATION
# =============================================================================
category: "Privilege Escalation"
sub_category: "new-passrole"
path_type: "one-hop"
target: "to-admin"
environments:
  - "prod"

# =============================================================================
# ATTACK PATH
# =============================================================================
attack_path:
  principals:
    - "arn:aws:iam::{account_id}:user/pl-prod-bedrock-006-to-admin-starting-user"
    - "arn:aws:iam::{account_id}:role/pl-prod-bedrock-006-to-admin-target-role"

  summary: "starting_user → (iam:PassRole + CreateBrowser) → new Custom Browser with admin execution role → (StartBrowserSession + ConnectBrowserAutomationStream) → CDP/Playwright context.route hook rewrites MMDS token request → read execution role credentials at 169.254.169.254 → admin access"

# =============================================================================
# REQUIRED PRECONDITIONS
# =============================================================================
required_preconditions:
  - type: "aws-resource"
    resource: "IAM Role"
    description: "with administrative privileges that trusts bedrock-agentcore.amazonaws.com as a service principal (so it can be passed to the new browser as its execution role)"

# =============================================================================
# PERMISSIONS
# =============================================================================
permissions:
  required:
    - principal: "pl-prod-bedrock-006-to-admin-starting-user"
      principal_type: "user"
      permissions:
        - permission: "iam:PassRole"
          resource: "arn:aws:iam::*:role/pl-prod-bedrock-006-to-admin-target-role"
        - permission: "bedrock-agentcore:CreateBrowser"
          resource: "*"
        - permission: "bedrock-agentcore:StartBrowserSession"
          resource: "*"
        - permission: "bedrock-agentcore:ConnectBrowserAutomationStream"
          resource: "*"

  helpful:
    - principal: "pl-prod-bedrock-006-to-admin-starting-user"
      principal_type: "user"
      permissions:
        - permission: "iam:ListRoles"
          purpose: "Discover available privileged roles to pass to the new browser"
        - permission: "iam:GetRole"
          purpose: "View role trust policies and attached permissions"
        - permission: "bedrock-agentcore:GetBrowser"
          purpose: "Confirm the browser reached READY state before starting a session"

# =============================================================================
# MITRE ATT&CK
# =============================================================================
mitre_attack:
  tactics:
    - "TA0004 - Privilege Escalation"
    - "TA0006 - Credential Access"
  techniques:
    - "T1098.001 - Account Manipulation: Additional Cloud Credentials"
    - "T1552.005 - Unsecured Credentials: Cloud Instance Metadata API"

# =============================================================================
# TERRAFORM
# =============================================================================
terraform:
  variable_name: "enable_single_account_privesc_one_hop_to_admin_bedrock_006_iam_passrole_bedrockagentcore_createbrowser"
  module_path: "modules/scenarios/single-account/privesc-one-hop/to-admin/bedrock-006-iam-passrole+bedrockagentcore-createbrowser"
