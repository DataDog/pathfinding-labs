schema_version: "1.8.0"
name: "iam-passrole+lambda-createfunction+lambda-invokefunction"
title: "Lambda Function Creation + Invocation to Bucket"
description: "User with iam:PassRole, lambda:CreateFunction, and lambda:InvokeFunction can escalate by creating a Lambda with an S3-access role and invoking it to read sensitive bucket contents"
cost_estimate: "$0/mo"
cost_estimate_when_demo_executed: "$0/mo"
pathfinding-cloud-id: "lambda-001"

category: "Privilege Escalation"
sub_category: "new-passrole"
path_type: "one-hop"
target: "to-bucket"
environments:
  - "prod"

attack_path:
  principals:
    - "arn:aws:iam::{account_id}:user/pl-prod-lambda-001-to-bucket-starting-user"
    - "arn:aws:iam::{account_id}:role/pl-prod-lambda-001-to-bucket-target-role"
    - "arn:aws:s3:::pl-prod-lambda-001-to-bucket-{account_id}-{suffix}"
  summary: "starting_user → (PassRole + lambda:CreateFunction) → Lambda with S3-access role → (lambda:InvokeFunction) → Lambda reads flag from S3 → sensitive bucket access"

permissions:
  required:
    - principal: "pl-prod-lambda-001-to-bucket-starting-user"
      principal_type: "user"
      permissions:
        - permission: "iam:PassRole"
          resource: "arn:aws:iam::*:role/pl-prod-lambda-001-to-bucket-target-role"
        - permission: "lambda:CreateFunction"
          resource: "*"
        - permission: "lambda:InvokeFunction"
          resource: "*"
  helpful:
    - principal: "pl-prod-lambda-001-to-bucket-starting-user"
      principal_type: "user"
      permissions:
        - permission: "iam:ListRoles"
          purpose: "Discover available privileged roles"
        - permission: "lambda:GetFunction"
          purpose: "Verify function creation"

mitre_attack:
  tactics:
    - "TA0004 - Privilege Escalation"
    - "TA0009 - Collection"
  techniques:
    - "T1530 - Data from Cloud Storage Object"
    - "T1648 - Serverless Execution"

terraform:
  variable_name: "enable_single_account_privesc_one_hop_to_bucket_lambda_001_iam_passrole_lambda_createfunction_lambda_invokefunction"
  module_path: "modules/scenarios/single-account/privesc-one-hop/to-bucket/lambda-001-iam-passrole+lambda-createfunction+lambda-invokefunction"
