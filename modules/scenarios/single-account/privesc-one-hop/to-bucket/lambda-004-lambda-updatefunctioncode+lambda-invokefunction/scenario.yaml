schema_version: "1.8.0"
name: "lambda-updatefunctioncode+lambda-invokefunction"
title: "Lambda Code Update + Invocation to Bucket"
description: "User with lambda:UpdateFunctionCode and lambda:InvokeFunction can modify existing Lambda function code and manually invoke it to read sensitive S3 bucket contents using the function's privileged role"
cost_estimate: "$0/mo"
cost_estimate_when_demo_executed: "$0/mo"
pathfinding-cloud-id: "lambda-004"

category: "Privilege Escalation"
sub_category: "existing-passrole"
path_type: "one-hop"
target: "to-bucket"
environments:
  - "prod"

attack_path:
  principals:
    - "arn:aws:iam::{account_id}:user/pl-prod-lambda-004-to-bucket-starting-user"
    - "arn:aws:lambda:{region}:{account_id}:function/pl-prod-lambda-004-to-bucket-target-lambda"
    - "arn:aws:iam::{account_id}:role/pl-prod-lambda-004-to-bucket-target-role"
    - "arn:aws:s3:::pl-prod-lambda-004-to-bucket-{account_id}-{suffix}"
  summary: "starting_user → (lambda:UpdateFunctionCode) → existing Lambda function → (lambda:InvokeFunction) → Lambda reads flag from S3 using target role → sensitive bucket access"

permissions:
  required:
    - principal: "pl-prod-lambda-004-to-bucket-starting-user"
      principal_type: "user"
      permissions:
        - permission: "lambda:UpdateFunctionCode"
          resource: "arn:aws:lambda:*:*:function/pl-prod-lambda-004-to-bucket-target-lambda"
        - permission: "lambda:InvokeFunction"
          resource: "arn:aws:lambda:*:*:function/pl-prod-lambda-004-to-bucket-target-lambda"
  helpful:
    - principal: "pl-prod-lambda-004-to-bucket-starting-user"
      principal_type: "user"
      permissions:
        - permission: "lambda:GetFunction"
          purpose: "Discover Lambda function details including handler name and execution role"
        - permission: "lambda:ListFunctions"
          purpose: "Discover available Lambda functions to target"
        - permission: "iam:GetRole"
          purpose: "View Lambda execution role permissions to identify S3 access"

mitre_attack:
  tactics:
    - "TA0004 - Privilege Escalation"
    - "TA0009 - Collection"
  techniques:
    - "T1530 - Data from Cloud Storage Object"
    - "T1525 - Implant Internal Image"

terraform:
  variable_name: "enable_single_account_privesc_one_hop_to_bucket_lambda_004_lambda_updatefunctioncode_lambda_invokefunction"
  module_path: "modules/scenarios/single-account/privesc-one-hop/to-bucket/lambda-004-lambda-updatefunctioncode+lambda-invokefunction"
