schema_version: "1.8.0"
name: "lambda-updatefunctioncode+lambda-addpermission"
title: "Lambda Code Update + Permission Grant to Bucket"
description: "User with lambda:UpdateFunctionCode and lambda:AddPermission can modify existing Lambda function code, grant themselves invoke permission, and read sensitive S3 bucket contents using the function's privileged role"
cost_estimate: "$0/mo"
cost_estimate_when_demo_executed: "$0/mo"
pathfinding-cloud-id: "lambda-005"

category: "Privilege Escalation"
sub_category: "existing-passrole"
path_type: "one-hop"
target: "to-bucket"
environments:
  - "prod"

attack_path:
  principals:
    - "arn:aws:iam::{account_id}:user/pl-prod-lambda-005-to-bucket-starting-user"
    - "arn:aws:iam::{account_id}:role/pl-prod-lambda-005-to-bucket-lambda-exec-role"
    - "arn:aws:s3:::pl-prod-lambda-005-to-bucket-{account_id}-{suffix}"
  summary: "starting_user → (lambda:UpdateFunctionCode) → target Lambda → (lambda:AddPermission) → allow self invoke → (lambda:InvokeFunction) → Lambda reads S3 flag via lambda-exec-role → sensitive bucket access"

permissions:
  required:
    - principal: "pl-prod-lambda-005-to-bucket-starting-user"
      principal_type: "user"
      permissions:
        - permission: "lambda:UpdateFunctionCode"
          resource: "arn:aws:lambda:*:*:function/pl-prod-lambda-005-to-bucket-target-lambda"
        - permission: "lambda:AddPermission"
          resource: "arn:aws:lambda:*:*:function/pl-prod-lambda-005-to-bucket-target-lambda"
        - permission: "lambda:InvokeFunction"
          resource: "arn:aws:lambda:*:*:function/pl-prod-lambda-005-to-bucket-target-lambda"
  helpful:
    - principal: "pl-prod-lambda-005-to-bucket-starting-user"
      principal_type: "user"
      permissions:
        - permission: "lambda:GetFunction"
          purpose: "Discover target Lambda function and its execution role"
        - permission: "lambda:GetPolicy"
          purpose: "Verify resource-based policy was added"
        - permission: "lambda:ListFunctions"
          purpose: "Discover available Lambda functions"

mitre_attack:
  tactics:
    - "TA0004 - Privilege Escalation"
    - "TA0009 - Collection"
  techniques:
    - "T1530 - Data from Cloud Storage Object"
    - "T1648 - Serverless Execution"

terraform:
  variable_name: "enable_single_account_privesc_one_hop_to_bucket_lambda_005_lambda_updatefunctioncode_lambda_addpermission"
  module_path: "modules/scenarios/single-account/privesc-one-hop/to-bucket/lambda-005-lambda-updatefunctioncode+lambda-addpermission"
