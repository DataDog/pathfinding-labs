schema_version: "1.8.0"
name: "iam-passrole+lambda-createfunction+createeventsourcemapping-dynamodb"
title: "Lambda Function Creation + DynamoDB Event Source to Bucket"
description: "User with PassRole, CreateFunction, and CreateEventSourceMapping can create Lambda with S3-access role, link to DynamoDB stream, and access sensitive bucket contents when table events trigger execution"
cost_estimate: "$0/mo"
cost_estimate_when_demo_executed: "$0/mo"
pathfinding-cloud-id: "lambda-002"

demo_timeout_seconds: 600

category: "Privilege Escalation"
sub_category: "new-passrole"
path_type: "one-hop"
target: "to-bucket"
environments:
  - "prod"

attack_path:
  principals:
    - "arn:aws:iam::{account_id}:user/pl-prod-lambda-002-to-bucket-starting-user"
    - "arn:aws:iam::{account_id}:role/pl-prod-lambda-002-to-bucket-target-role"
    - "arn:aws:lambda:{region}:{account_id}:function/pl-lambda-002-to-bucket-escalation-fn"
    - "arn:aws:s3:::pl-prod-lambda-002-to-bucket-{account_id}-{suffix}"
  summary: "starting_user → (PassRole + CreateFunction) → Lambda with S3-access role → (CreateEventSourceMapping) → DynamoDB stream trigger → Lambda reads S3 flag → writes flag to exfil DynamoDB table → starting_user reads flag via GetItem"

permissions:
  required:
    - principal: "pl-prod-lambda-002-to-bucket-starting-user"
      principal_type: "user"
      permissions:
        - permission: "iam:PassRole"
          resource: "arn:aws:iam::*:role/pl-prod-lambda-002-to-bucket-target-role"
        - permission: "lambda:CreateFunction"
          resource: "*"
        - permission: "lambda:CreateEventSourceMapping"
          resource: "*"
  helpful:
    - principal: "pl-prod-lambda-002-to-bucket-starting-user"
      principal_type: "user"
      permissions:
        - permission: "dynamodb:ListStreams"
          purpose: "Discover available DynamoDB streams to target"
        - permission: "dynamodb:DescribeStream"
          purpose: "Get stream ARN and configuration details"
        - permission: "dynamodb:DescribeTable"
          purpose: "Get table details including stream ARN"
        - permission: "lambda:ListFunctions"
          purpose: "Verify Lambda function creation"
        - permission: "lambda:GetFunction"
          purpose: "Confirm function configuration and role"
        - permission: "lambda:GetEventSourceMapping"
          purpose: "Check event source mapping status"
        - permission: "iam:ListRoles"
          purpose: "Discover privileged roles available for PassRole"
        - permission: "dynamodb:PutItem"
          purpose: "Trigger Lambda execution by inserting test record"
        - permission: "dynamodb:GetItem"
          purpose: "Retrieve exfiltrated flag written by Lambda to exfil table"

mitre_attack:
  tactics:
    - "TA0004 - Privilege Escalation"
    - "TA0009 - Collection"
  techniques:
    - "T1530 - Data from Cloud Storage Object"
    - "T1578 - Modify Cloud Compute Infrastructure"

terraform:
  variable_name: "enable_single_account_privesc_one_hop_to_bucket_lambda_002_iam_passrole_lambda_createfunction_createeventsourcemapping_dynamodb"
  module_path: "modules/scenarios/single-account/privesc-one-hop/to-bucket/lambda-002-iam-passrole+lambda-createfunction+createeventsourcemapping-dynamodb"
