schema_version: "1.8.0"
name: "lambda-updatefunctioncode"
title: "Lambda Function Code Update to Bucket"
description: "User with lambda:UpdateFunctionCode can modify existing Lambda function code to read sensitive S3 bucket contents using the function's privileged role"
cost_estimate: "$0/mo"
cost_estimate_when_demo_executed: "$0/mo"
pathfinding-cloud-id: "lambda-003"

category: "Privilege Escalation"
sub_category: "existing-passrole"
path_type: "one-hop"
target: "to-bucket"
environments:
  - "prod"

required_preconditions:
  - type: "aws-resource"
    resource: "Lambda Function"
    description: "with a privileged execution role that has s3:GetObject and s3:ListBucket on the target bucket"
  - type: "aws-resource"
    resource: "IAM Role"
    description: "attached to the Lambda function as the execution role, with read access scoped to the target S3 bucket"
  - type: "aws-resource"
    resource: "S3 Bucket"
    description: "containing the CTF flag (flag.txt), inaccessible to the starting user directly"

attack_path:
  principals:
    - "arn:aws:iam::{account_id}:user/pl-prod-lambda-003-to-bucket-starting-user"
    - "arn:aws:lambda:{region}:{account_id}:function/pl-prod-lambda-003-to-bucket-target-lambda"
    - "arn:aws:iam::{account_id}:role/pl-prod-lambda-003-to-bucket-target-role"
    - "arn:aws:s3:::pl-prod-lambda-003-to-bucket-{account_id}-{suffix}"
  summary: "starting_user → (lambda:UpdateFunctionCode) → existing Lambda function with pre-set TARGET_BUCKET env var → (lambda:InvokeFunction) → Lambda reads flag.txt from S3 using target role → CTF flag in response body"

permissions:
  required:
    - principal: "pl-prod-lambda-003-to-bucket-starting-user"
      principal_type: "user"
      permissions:
        - permission: "lambda:UpdateFunctionCode"
          resource: "arn:aws:lambda:*:*:function/pl-prod-lambda-003-to-bucket-target-lambda"
        - permission: "lambda:InvokeFunction"
          resource: "arn:aws:lambda:*:*:function/pl-prod-lambda-003-to-bucket-target-lambda"
  helpful:
    - principal: "pl-prod-lambda-003-to-bucket-starting-user"
      principal_type: "user"
      permissions:
        - permission: "lambda:GetFunction"
          purpose: "Discover Lambda function details including handler name and execution role"
        - permission: "lambda:ListFunctions"
          purpose: "Discover available Lambda functions to target"
        - permission: "iam:GetRole"
          purpose: "View Lambda execution role permissions to identify S3 access"

mitre_attack:
  tactics:
    - "TA0004 - Privilege Escalation"
    - "TA0009 - Collection"
  techniques:
    - "T1530 - Data from Cloud Storage Object"
    - "T1525 - Implant Internal Image"

terraform:
  variable_name: "enable_single_account_privesc_one_hop_to_bucket_lambda_003_lambda_updatefunctioncode"
  module_path: "modules/scenarios/single-account/privesc-one-hop/to-bucket/lambda-003-lambda-updatefunctioncode"
