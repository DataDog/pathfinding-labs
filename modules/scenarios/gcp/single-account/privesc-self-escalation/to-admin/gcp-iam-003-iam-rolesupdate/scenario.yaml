# =============================================================================
# CORE METADATA
# =============================================================================
schema_version: "1.10.1"
name: "gcp-iam-003-iam-rolesupdate"
title: "Custom Role Update Self-Escalation to Admin"
description: "Service account bound to a project custom role that it can also update (iam.roles.update) adds resourcemanager.projects.setIamPolicy to that role, then self-binds roles/owner to gain project admin"
cost_estimate: "$0/mo"
cost_estimate_when_demo_executed: "$0/mo"
pathfinding-cloud-id: "gcp-iam-003"

# =============================================================================
# CLASSIFICATION
# =============================================================================
category: "Privilege Escalation"
sub_category: "self-escalation"
path_type: "self-escalation"
target: "to-admin"
points: 10
environments:
  - "prod"

# =============================================================================
# ATTACK PATH
# =============================================================================
attack_path:
  principals:
    - "//iam.googleapis.com/projects/{project_id}/serviceAccounts/pl-prod-gcp-iam-003-start@{project_id}.iam.gserviceaccount.com"

  summary: "starting_sa (bound to a project custom role that includes iam.roles.update) -> (iam.roles.update adds resourcemanager.projects.setIamPolicy to that role) -> (resourcemanager.projects.setIamPolicy self-binds roles/owner) -> Project Admin + flag"

# =============================================================================
# PERMISSIONS
# =============================================================================
# Verified by scenario-permission-isolator-gcp (2026-11-11) against a live deploy:
# required = iam.roles.update only (the vulnerability — SA edits the role it holds).
# resourcemanager.projects.setIamPolicy is ACQUIRED mid-attack by editing the role,
# not a starting permission. iam.roles.get and resourcemanager.projects.getIamPolicy
# are gcloud-mechanics (raw API does not need them); iam.roles.list and
# resourcemanager.projects.get are recon. All four helpful perms confirmed needed by
# the gcloud-mode demo; none trimmed. All live in the single editable custom role.
permissions:
  required:
    - principal: "pl-prod-gcp-iam-003-start"
      principal_type: "service-account"
      permissions:
        - permission: "iam.roles.update"
          resource: "projects/{project_id}/roles/{custom_role_id}"

  helpful:
    - principal: "pl-prod-gcp-iam-003-start"
      principal_type: "service-account"
      permissions:
        - permission: "iam.roles.get"
          purpose: "Required by gcloud iam roles update --add-permissions only — gcloud reads the role before writing; a raw roles.patch that sets includedPermissions replaces the whole list and does not need it"
        - permission: "iam.roles.list"
          purpose: "Enumerate project custom roles to identify which bound role is editable"
        - permission: "resourcemanager.projects.get"
          purpose: "Confirm the current project context and lack of direct admin roles"
        - permission: "resourcemanager.projects.getIamPolicy"
          purpose: "Required by gcloud projects add-iam-policy-binding only — gcloud reads the project policy before writing it; not needed with the raw setIamPolicy API"

# =============================================================================
# MITRE ATT&CK
# =============================================================================
mitre_attack:
  tactics:
    - "TA0004 - Privilege Escalation"
  techniques:
    - "T1098 - Account Manipulation"
    - "T1078.004 - Valid Accounts: Cloud Accounts"

# =============================================================================
# TERRAFORM
# =============================================================================
terraform:
  variable_name: "enable_gcp_single_account_privesc_self_escalation_to_admin_gcp_iam_003_iam_rolesupdate"
  module_path: "modules/scenarios/gcp/single-account/privesc-self-escalation/to-admin/gcp-iam-003-iam-rolesupdate"
