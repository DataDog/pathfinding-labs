# =============================================================================
# CORE METADATA
# =============================================================================
schema_version: "1.2.0"
name: "gcp-iam-001-iam-serviceaccountsgetaccesstoken"
title: "Service Account Access Token Generation to Admin"
description: "Service account with iam.serviceAccounts.getAccessToken on a privileged service account can mint impersonation tokens and inherit its roles/editor project permissions"
cost_estimate: "$0/mo"
cost_estimate_when_demo_executed: "$0/mo"
pathfinding-cloud-id: "gcp-iam-001"

# =============================================================================
# CLASSIFICATION
# =============================================================================
category: "Privilege Escalation"
sub_category: "principal-access"
path_type: "one-hop"
target: "to-admin"
environments:
  - "prod"

# =============================================================================
# ATTACK PATH
# =============================================================================
attack_path:
  principals:
    - "//iam.googleapis.com/projects/{project_id}/serviceAccounts/pl-prod-gcp-iam-001-start@{project_id}.iam.gserviceaccount.com"
    - "//iam.googleapis.com/projects/{project_id}/serviceAccounts/pl-prod-gcp-iam-001-target@{project_id}.iam.gserviceaccount.com"

  summary: "starting_sa -> (iam.serviceAccounts.getAccessToken via minimal custom role) -> target_sa -> (roles/editor) -> Project Admin"

# =============================================================================
# PERMISSIONS
# =============================================================================
permissions:
  required:
    - principal: "pl-prod-gcp-iam-001-start"
      principal_type: "service-account"
      permissions:
        - permission: "iam.serviceAccounts.getAccessToken"
          resource: "//iam.googleapis.com/projects/{project_id}/serviceAccounts/pl-prod-gcp-iam-001-target@{project_id}.iam.gserviceaccount.com"

  helpful:
    - principal: "pl-prod-gcp-iam-001-start"
      principal_type: "service-account"
      permissions:
        - permission: "resourcemanager.projects.get"
          purpose: "Confirm the current project context and lack of direct project-level roles"
        - permission: "iam.serviceAccounts.list"
          purpose: "Enumerate other service accounts in the project to identify impersonation targets"
        - permission: "iam.serviceAccounts.getIamPolicy"
          purpose: "Inspect IAM policy bindings on candidate service accounts to find impersonation grants (predefined roles/iam.serviceAccountTokenCreator or a custom role granting iam.serviceAccounts.getAccessToken)"

# =============================================================================
# MITRE ATT&CK
# =============================================================================
mitre_attack:
  tactics:
    - "TA0004 - Privilege Escalation"
    - "TA0006 - Credential Access"
  techniques:
    - "T1550.001 - Use Alternate Authentication Material: Application Access Token"
    - "T1078.004 - Valid Accounts: Cloud Accounts"

# =============================================================================
# TERRAFORM
# =============================================================================
terraform:
  variable_name: "enable_gcp_single_account_privesc_one_hop_to_admin_gcp_iam_001_iam_serviceaccountsgetaccesstoken"
  module_path: "modules/scenarios/gcp/single-account/privesc-one-hop/to-admin/gcp-iam-001-iam-serviceaccountsgetaccesstoken"
