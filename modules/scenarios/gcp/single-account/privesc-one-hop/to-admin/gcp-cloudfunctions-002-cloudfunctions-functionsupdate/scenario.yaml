# =============================================================================
# CORE METADATA
# =============================================================================
schema_version: "1.2.0"
name: "gcp-cloudfunctions-002-cloudfunctions-functionsupdate"
title: "Cloud Function Code Update to Existing Admin SA"
description: "Service account with cloudfunctions.functions.update and cloudfunctions.functions.sourceCodeSet on an existing 2nd-gen Cloud Function can replace its code with a token-exfiltration payload; since the function already runs as a privileged target service account, invoking the updated function leaks that account's OAuth token from the metadata server, granting its roles/editor project permissions"
cost_estimate: "$0/mo"
cost_estimate_when_demo_executed: "$0/mo"
pathfinding-cloud-id: "gcp-cloudfunctions-002"

# =============================================================================
# CLASSIFICATION
# =============================================================================
category: "Privilege Escalation"
sub_category: "new-passrole"
path_type: "one-hop"
target: "to-admin"
environments:
  - "prod"

# =============================================================================
# ATTACK PATH
# =============================================================================
attack_path:
  principals:
    - "//iam.googleapis.com/projects/{project_id}/serviceAccounts/pl-prod-cf002-start@{project_id}.iam.gserviceaccount.com"
    - "//iam.googleapis.com/projects/{project_id}/serviceAccounts/pl-prod-cf002-target@{project_id}.iam.gserviceaccount.com"

  summary: "starting_sa -> (cloudfunctions.functions.update + cloudfunctions.functions.sourceCodeSet + iam.serviceAccounts.actAs on target_sa) -> replaces code of existing 2nd-gen Cloud Function that already runs as target_sa (code-only update, SA unchanged) -> invokes updated function via run.routes.invoke -> exfiltrates target_sa's OAuth access token from the function's metadata server -> (roles/editor) -> Project Admin"

# =============================================================================
# PERMISSIONS
# =============================================================================
permissions:
  required:
    - principal: "pl-prod-cf002-start"
      principal_type: "service-account"
      permissions:
        - permission: "iam.serviceAccounts.actAs"
          resource: "//iam.googleapis.com/projects/{project_id}/serviceAccounts/pl-prod-cf002-target@{project_id}.iam.gserviceaccount.com"
        - permission: "cloudfunctions.functions.update"
          resource: "//cloudfunctions.googleapis.com/projects/{project_id}/locations/-/functions/{function_name}"
        - permission: "cloudfunctions.functions.sourceCodeSet"
          resource: "//cloudfunctions.googleapis.com/projects/{project_id}/locations/-/functions/{function_name}"
        - permission: "run.routes.invoke"
          resource: "//run.googleapis.com/projects/{project_id}/locations/-/services/-"

  helpful:
    - principal: "pl-prod-cf002-start"
      principal_type: "service-account"
      permissions:
        - permission: "cloudfunctions.functions.get"
          purpose: "Required by gcloud functions deploy — reads the function's current config before submitting the update; also used to retrieve the invocation URL after update and poll deployment state"
        - permission: "cloudfunctions.operations.get"
          purpose: "Required by gcloud functions deploy — polls the update long-running operation (no --async flag exists for gen2)"
        - permission: "resourcemanager.projects.get"
          purpose: "Required by gcloud functions deploy and gcloud functions describe — unconditional preflight GET /v1/projects/{id}"
        - permission: "cloudbuild.builds.get"
          purpose: "Required by gcloud functions deploy only — gcloud calls Cloud Build's GetDefaultServiceAccount endpoint (/v1/projects/{id}/locations/{region}/defaultServiceAccount) before every deploy; not called by the raw Cloud Functions v2 API"
        - permission: "resourcemanager.projects.getIamPolicy"
          purpose: "Required by gcloud functions deploy only — gcloud validates the project IAM policy as part of its deploy flow; not needed with the raw API"
        - permission: "run.services.getIamPolicy"
          purpose: "Required by gcloud functions deploy only — gcloud reads the Cloud Run service IAM policy post-deploy to verify invocation settings; not needed with the raw API"
        - permission: "run.services.setIamPolicy"
          purpose: "Required by gcloud functions deploy only — gcloud enforces --no-allow-unauthenticated by setting the Cloud Run service IAM policy after deploy; not needed with the raw API"
        - permission: "iam.serviceAccounts.list"
          purpose: "Enumerate service accounts in the project to identify which privileged SA is attached to the target function"
        - permission: "iam.serviceAccounts.getIamPolicy"
          purpose: "Inspect IAM policy bindings on candidate service accounts to understand their project roles and confirm the attached SA is high-value"

# =============================================================================
# MITRE ATT&CK
# =============================================================================
mitre_attack:
  tactics:
    - "TA0004 - Privilege Escalation"
    - "TA0006 - Credential Access"
  techniques:
    - "T1550.001 - Use Alternate Authentication Material: Application Access Token"
    - "T1078.004 - Valid Accounts: Cloud Accounts"
    - "T1525 - Implant Internal Image"

# =============================================================================
# TERRAFORM
# =============================================================================
terraform:
  variable_name: "enable_gcp_single_account_privesc_one_hop_to_admin_gcp_cloudfunctions_002_cloudfunctions_functionsupdate"
  module_path: "modules/scenarios/gcp/single-account/privesc-one-hop/to-admin/gcp-cloudfunctions-002-cloudfunctions-functionsupdate"
