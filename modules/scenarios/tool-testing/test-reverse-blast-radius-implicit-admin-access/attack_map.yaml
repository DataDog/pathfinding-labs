attackMap:
  nodes:
    - id: reader-user
      label: "Reader User"
      type: principal
      subType: iam-user
      arn: "arn:aws:iam::{account_id}:user/pl-prod-rbr-ia-reader-user"
      access:
        type: assumed-breach-credentials
      description: >
        You have gained access to this principal's AWS IAM credentials. These could
        have been obtained through many real-world vectors: phishing a developer and
        gaining access to their workstation, compromising a browser session, exploiting
        a vulnerable workload running in this AWS account, discovering credentials in
        a public S3 bucket, or finding them hardcoded in source code or a CI/CD pipeline.

        Regardless of how you obtained them, you are now operating as this principal.
        This IAM user has explicit s3:GetObject and s3:ListBucket permissions on the
        target bucket, and nothing else.

    - id: writer-user
      label: "Writer User"
      type: principal
      subType: iam-user
      arn: "arn:aws:iam::{account_id}:user/pl-prod-rbr-ia-writer-user"
      access:
        type: assumed-breach-credentials
      description: >
        You have gained access to this principal's AWS IAM credentials. These could
        have been obtained through many real-world vectors: phishing a developer and
        gaining access to their workstation, compromising a browser session, exploiting
        a vulnerable workload running in this AWS account, discovering credentials in
        a public S3 bucket, or finding them hardcoded in source code or a CI/CD pipeline.

        Regardless of how you obtained them, you are now operating as this principal.
        This IAM user has an explicit s3:PutObject permission on the target bucket and
        cannot read from it.

    - id: admin-user
      label: "Admin User"
      type: principal
      subType: iam-user
      isAdmin: true
      arn: "arn:aws:iam::{account_id}:user/pl-prod-rbr-ia-admin-user"
      access:
        type: assumed-breach-credentials
      description: >
        You have gained access to this principal's AWS IAM credentials. These could
        have been obtained through many real-world vectors: phishing a developer and
        gaining access to their workstation, compromising a browser session, exploiting
        a vulnerable workload running in this AWS account, discovering credentials in
        a public S3 bucket, or finding them hardcoded in source code or a CI/CD pipeline.

        Regardless of how you obtained them, you are now operating as this principal.
        This IAM user has the AWS managed AdministratorAccess policy attached. No policy
        statement mentions S3 or the target bucket, so its access to the bucket is
        implicit.

    - id: admin-role
      label: "Admin Role"
      type: principal
      subType: iam-role
      isAdmin: true
      arn: "arn:aws:iam::{account_id}:role/pl-prod-rbr-ia-admin-role"
      description: >
        This IAM role has an inline policy allowing every action on every resource, with
        no S3-specific statement. Its trust policy trusts only the EC2 service principal,
        so no user or role in the account can assume it and there is no assume-role edge
        into it. Its access to the bucket is purely implicit administrator access, which
        is what makes it a useful test of reverse blast radius completeness.

    - id: target-bucket
      label: "Sensitive S3 Bucket"
      type: resource
      subType: s3-bucket
      isTarget: true
      arn: "arn:aws:s3:::pl-sensitive-data-rbr-ia-{account_id}-{suffix}"
      description: >
        This is the target sensitive S3 bucket. It has no bucket policy, so all access
        derives from identity policies. A correct reverse blast radius query for reading
        returns reader-user, admin-user, and admin-role. A query for writing returns
        writer-user, admin-user, and admin-role. The negative control
        pl-prod-rbr-ia-no-access-user has no permissions and must appear in neither.

  edges:
    - from: reader-user
      to: target-bucket
      label: "s3:GetObject, s3:ListBucket"
      description: >
        The reader has explicit IAM permissions to list and read objects in the target
        bucket. This is the explicit read edge that most tools detect. The same user is
        denied when attempting to write.
      hints:
        - "This user holds explicit S3 read permissions on the bucket, so list and download objects directly. A write attempt should be denied."
      commands:
        - description: "List bucket contents as reader-user"
          command: "aws s3 ls s3://pl-sensitive-data-rbr-ia-{account_id}-{suffix}/"
        - description: "Read an object as reader-user"
          command: "aws s3 cp s3://pl-sensitive-data-rbr-ia-{account_id}-{suffix}/sensitive-data.txt -"

    - from: writer-user
      to: target-bucket
      label: "s3:PutObject"
      description: >
        The writer has an explicit s3:PutObject permission on the objects in the target
        bucket. This is the explicit write edge. The same user is denied when attempting
        to read.
      hints:
        - "This user holds an explicit S3 write permission on the bucket, so upload an object directly. A read attempt should be denied."
      commands:
        - description: "Write an object as writer-user"
          command: "echo 'rbr-ia write test' | aws s3 cp - s3://pl-sensitive-data-rbr-ia-{account_id}-{suffix}/rbr-ia-demo/writer-probe.txt"

    - from: admin-user
      to: target-bucket
      label: "Implicit administrator access (AdministratorAccess)"
      description: >
        This is the edge a tool must infer. admin-user has no S3-specific statement, but
        the AdministratorAccess managed policy allows every action on every resource, so
        it can both read and write the bucket. The pathfinding graph backend does not
        create an edge from every administrator to every resource, so a reverse blast
        radius query can omit this principal unless the tool treats administrator status
        as implicit access.
      hints:
        - "AdministratorAccess needs no S3-specific statement. Read and write the bucket directly and expect both to succeed."
      commands:
        - description: "Read an object as admin-user"
          command: "aws s3 cp s3://pl-sensitive-data-rbr-ia-{account_id}-{suffix}/sensitive-data.txt -"
        - description: "Write an object as admin-user"
          command: "echo 'rbr-ia write test' | aws s3 cp - s3://pl-sensitive-data-rbr-ia-{account_id}-{suffix}/rbr-ia-demo/admin-probe.txt"

    - from: admin-role
      to: target-bucket
      label: "Implicit administrator access (Action * on Resource *)"
      description: >
        This is the edge a tool must infer. admin-role has an inline wildcard policy and
        no S3-specific statement, and nothing can assume it, so there is no path into the
        role either. Its ability to read and write the bucket is shown by policy
        simulation rather than by assuming the role. A complete reverse blast radius
        answer still includes this role.
      hints:
        - "No principal can assume this role, so confirm its effective S3 access with policy simulation rather than live calls."
      commands:
        - description: "Simulate read access for admin-role"
          command: "aws iam simulate-principal-policy --policy-source-arn arn:aws:iam::{account_id}:role/pl-prod-rbr-ia-admin-role --action-names s3:GetObject --resource-arns arn:aws:s3:::pl-sensitive-data-rbr-ia-{account_id}-{suffix}/sensitive-data.txt --query 'EvaluationResults[*].[EvalActionName,EvalDecision]' --output text"
        - description: "Simulate write access for admin-role"
          command: "aws iam simulate-principal-policy --policy-source-arn arn:aws:iam::{account_id}:role/pl-prod-rbr-ia-admin-role --action-names s3:PutObject --resource-arns arn:aws:s3:::pl-sensitive-data-rbr-ia-{account_id}-{suffix}/sensitive-data.txt --query 'EvaluationResults[*].[EvalActionName,EvalDecision]' --output text"
