attackMap:
  nodes:
    - id: starting-principal
      label: "Starting User"
      type: principal
      subType: iam-user
      arn: "arn:aws:iam::{account_id}:user/pl-prod-patn-starting-user"
      access:
        type: assumed-breach-credentials
      description: >
        You have gained access to this principal's AWS IAM credentials. These could
        have been obtained through many real-world vectors: phishing a developer and
        gaining access to their workstation, compromising a browser session, exploiting
        a vulnerable workload running in this AWS account, discovering credentials in
        a public S3 bucket, or finding them hardcoded in source code or a CI/CD pipeline.

        Regardless of how you obtained them, you are now operating as this principal.
        This IAM user can assume the two role-based test principals via sts:AssumeRole.
        The goal of this scenario is not exploitation -- it is to validate that a
        graph/CSPM tool infers identical bucket-access edges for all four test
        principals regardless of whether the underlying grant is an inline or a
        customer-managed IAM policy.

    - id: user-inline
      label: "IAM User (inline policy)"
      type: principal
      subType: iam-user
      arn: "arn:aws:iam::{account_id}:user/pl-prod-patn-user-inline"
      description: >
        An IAM user whose full read/write access to the target bucket comes from a
        policy document embedded directly on the user (an inline policy), rather than
        a separate managed policy resource. Functionally identical in effective
        permissions to the other three test principals in this scenario.

    - id: user-managed
      label: "IAM User (managed policy)"
      type: principal
      subType: iam-user
      arn: "arn:aws:iam::{account_id}:user/pl-prod-patn-user-managed"
      description: >
        An IAM user whose full read/write access to the target bucket comes from a
        standalone customer-managed policy attached to the user, rather than an inline
        policy document. Functionally identical in effective permissions to the other
        three test principals in this scenario.

    - id: role-inline
      label: "IAM Role (inline policy)"
      type: principal
      subType: iam-role
      arn: "arn:aws:iam::{account_id}:role/pl-prod-patn-role-inline"
      description: >
        An IAM role whose full read/write access to the target bucket comes from a
        policy document embedded directly on the role (an inline policy). Assumed via
        the starting user's sts:AssumeRole permission. Functionally identical in
        effective permissions to the other three test principals in this scenario.

    - id: role-managed
      label: "IAM Role (managed policy)"
      type: principal
      subType: iam-role
      arn: "arn:aws:iam::{account_id}:role/pl-prod-patn-role-managed"
      description: >
        An IAM role whose full read/write access to the target bucket comes from a
        standalone customer-managed policy attached to the role, rather than an inline
        policy document. Assumed via the starting user's sts:AssumeRole permission.
        Functionally identical in effective permissions to the other three test
        principals in this scenario.

    - id: target-bucket
      label: "Test S3 Bucket"
      type: resource
      subType: s3-bucket
      isTarget: true
      arn: "arn:aws:s3:::pl-patn-bucket-{account_id}-{suffix}"
      description: >
        The target S3 bucket used to validate that access is inferred identically
        regardless of the IAM attachment mechanism. All four test principals should
        be able to list, read, and write objects in this bucket -- the mechanism
        granting that access differs, but the resulting edge in any accurate graph
        or CSPM tool should not.

  edges:
    - from: starting-principal
      to: user-inline
      label: "Direct credentials (inline policy)"
      description: >
        This test principal is a separate IAM user, already provisioned with its own
        access keys as a second identity you control. Its bucket access comes from an
        inline policy embedded directly on the user -- no privilege escalation step is
        required to reach it.
      hints:
        - "Retrieve this user's access key pair from Terraform outputs and export them as your active credentials -- the user already has direct S3 access via its inline policy, so no escalation step is needed."
      commands:
        - description: "Export credentials for the inline-policy user"
          command: "export AWS_ACCESS_KEY_ID=<user_inline_access_key_id>; export AWS_SECRET_ACCESS_KEY=<user_inline_secret_access_key>"

    - from: starting-principal
      to: user-managed
      label: "Direct credentials (managed policy)"
      description: >
        This test principal is a separate IAM user, already provisioned with its own
        access keys as a second identity you control. Its bucket access comes from a
        customer-managed policy attached to the user rather than an inline document,
        but the resulting permissions are identical.
      hints:
        - "Retrieve this user's access key pair from Terraform outputs -- its S3 access comes from a customer-managed policy attachment (aws_iam_user_policy_attachment) rather than an inline document, but the resulting permissions are identical to the inline-policy user."
      commands:
        - description: "Export credentials for the managed-policy user"
          command: "export AWS_ACCESS_KEY_ID=<user_managed_access_key_id>; export AWS_SECRET_ACCESS_KEY=<user_managed_secret_access_key>"

    - from: starting-principal
      to: role-inline
      label: "sts:AssumeRole"
      description: >
        The starting user assumes this role, which carries an inline policy granting
        the same full read/write bucket access as the other three test principals.
      hints:
        - "Use sts:AssumeRole with the starting user's credentials to obtain temporary credentials for this role -- its S3 permissions come from an inline role policy embedded directly on the role."
      commands:
        - description: "Assume the inline-policy role"
          command: "aws sts assume-role --role-arn arn:aws:iam::{account_id}:role/pl-prod-patn-role-inline --role-session-name test-session"

    - from: starting-principal
      to: role-managed
      label: "sts:AssumeRole"
      description: >
        The starting user assumes this role, which carries a customer-managed policy
        attachment granting the same full read/write bucket access as the other three
        test principals.
      hints:
        - "Use sts:AssumeRole to assume this role -- its S3 permissions come from a customer-managed policy attached via aws_iam_role_policy_attachment rather than an inline document, but access is identical to the inline-policy role."
      commands:
        - description: "Assume the managed-policy role"
          command: "aws sts assume-role --role-arn arn:aws:iam::{account_id}:role/pl-prod-patn-role-managed --role-session-name test-session"

    - from: user-inline
      to: target-bucket
      label: "s3:GetObject / s3:PutObject"
      description: >
        Using this principal's credentials, list, read, and write objects in the
        target bucket to confirm the inline policy grant functions identically to the
        other three test principals' access.
      hints:
        - "Run s3:ListBucket, s3:PutObject, and s3:GetObject against the target bucket with this principal's credentials -- successful access confirms your tool should have inferred this edge from the inline policy document."
      commands:
        - description: "List the target bucket"
          command: "aws s3 ls s3://pl-patn-bucket-{account_id}-{suffix}/"
        - description: "Write a test object"
          command: "aws s3 cp test.txt s3://pl-patn-bucket-{account_id}-{suffix}/test.txt"
        - description: "Read the test object back"
          command: "aws s3 cp s3://pl-patn-bucket-{account_id}-{suffix}/test.txt -"

    - from: user-managed
      to: target-bucket
      label: "s3:GetObject / s3:PutObject"
      description: >
        Using this principal's credentials, list, read, and write objects in the
        target bucket to confirm the customer-managed policy grant functions
        identically to the other three test principals' access.
      hints:
        - "Run s3:ListBucket, s3:PutObject, and s3:GetObject against the target bucket with this principal's credentials -- successful access confirms your tool should have traversed the managed-policy attachment to infer this edge."
      commands:
        - description: "List the target bucket"
          command: "aws s3 ls s3://pl-patn-bucket-{account_id}-{suffix}/"
        - description: "Write a test object"
          command: "aws s3 cp test.txt s3://pl-patn-bucket-{account_id}-{suffix}/test.txt"
        - description: "Read the test object back"
          command: "aws s3 cp s3://pl-patn-bucket-{account_id}-{suffix}/test.txt -"

    - from: role-inline
      to: target-bucket
      label: "s3:GetObject / s3:PutObject"
      description: >
        Using the temporary credentials from the assumed role, list, read, and write
        objects in the target bucket to confirm the inline role policy grant functions
        identically to the other three test principals' access.
      hints:
        - "With the assumed role's temporary credentials, run s3:ListBucket, s3:PutObject, and s3:GetObject against the target bucket -- successful access confirms your tool should have inferred this edge from the role's inline policy."
      commands:
        - description: "List the target bucket"
          command: "aws s3 ls s3://pl-patn-bucket-{account_id}-{suffix}/"
        - description: "Write a test object"
          command: "aws s3 cp test.txt s3://pl-patn-bucket-{account_id}-{suffix}/test.txt"
        - description: "Read the test object back"
          command: "aws s3 cp s3://pl-patn-bucket-{account_id}-{suffix}/test.txt -"

    - from: role-managed
      to: target-bucket
      label: "s3:GetObject / s3:PutObject"
      description: >
        Using the temporary credentials from the assumed role, list, read, and write
        objects in the target bucket to confirm the customer-managed policy attachment
        grant functions identically to the other three test principals' access.
      hints:
        - "With the assumed role's temporary credentials, run s3:ListBucket, s3:PutObject, and s3:GetObject against the target bucket -- successful access confirms your tool should have traversed the role's managed-policy attachment to infer this edge."
      commands:
        - description: "List the target bucket"
          command: "aws s3 ls s3://pl-patn-bucket-{account_id}-{suffix}/"
        - description: "Write a test object"
          command: "aws s3 cp test.txt s3://pl-patn-bucket-{account_id}-{suffix}/test.txt"
        - description: "Read the test object back"
          command: "aws s3 cp s3://pl-patn-bucket-{account_id}-{suffix}/test.txt -"
