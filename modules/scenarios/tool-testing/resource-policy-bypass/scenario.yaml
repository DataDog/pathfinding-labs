# =============================================================================
# CORE METADATA
# =============================================================================
schema_version: "1.10.0"
status: "beta"
name: "resource-policy-bypass"
title: "Resource Policy Bypass via Role Assumption to Bucket"
description: "Bypass S3 bucket resource policy restrictions by assuming role with bucket access"
cost_estimate: "$0/mo"
cost_estimate_when_demo_executed: "$0/mo"

# =============================================================================
# CLASSIFICATION
# =============================================================================
category: "Tool Testing"
sub_category: "edge-case-detection"
path_type: "multi-hop"
target: "to-bucket"
points: 10
environments:
  - "prod"

# =============================================================================
# ATTACK PATH
# =============================================================================
attack_path:
  principals:
    - "arn:aws:iam::{account_id}:user/pl-prod-rpb-to-bucket-starting-user"
    - "arn:aws:iam::{account_id}:role/pl-bucket-access-role"
    - "arn:aws:s3:::pl-sensitive-data-{account_id}-{suffix}"

  summary: "starting_user → (sts:AssumeRole) → pl-bucket-access-role → (bucket resource policy grants ListBucket/GetObject/PutObject/DeleteObject; identity policy only has s3:ListAllMyBuckets) → sensitive bucket access"

# =============================================================================
# PERMISSIONS
# =============================================================================
permissions:
  required:
    - principal: "pl-prod-rpb-to-bucket-starting-user"
      principal_type: "user"
      permissions:
        - permission: "sts:AssumeRole"
          resource: "arn:aws:iam::{account_id}:role/pl-bucket-access-role"

  helpful:
    - principal: "pl-prod-rpb-to-bucket-starting-user"
      principal_type: "user"
      permissions:
        - permission: "sts:GetCallerIdentity"
          purpose: "Confirm the current identity"
        - permission: "iam:ListRoles"
          purpose: "Discover roles with bucket access"
        - permission: "s3:GetBucketPolicy"
          purpose: "View bucket resource policy restrictions"
        - permission: "iam:GetRole"
          purpose: "View role trust and attached policies"

# =============================================================================
# MITRE ATT&CK
# =============================================================================
mitre_attack:
  tactics:
    - "TA0004 - Privilege Escalation"
    - "TA0005 - Defense Evasion"
    - "TA0009 - Collection"
  techniques:
    - "T1078.004 - Valid Accounts: Cloud Accounts"
    - "T1530 - Data from Cloud Storage Object"

# =============================================================================
# TERRAFORM
# =============================================================================
terraform:
  variable_name: "enable_tool_testing_resource_policy_bypass"
  module_path: "modules/scenarios/tool-testing/resource-policy-bypass"
