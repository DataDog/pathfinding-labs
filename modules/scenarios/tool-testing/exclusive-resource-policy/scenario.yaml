# =============================================================================
# CORE METADATA
# =============================================================================
schema_version: "1.10.0"
status: "beta"
name: "exclusive-resource-policy"
title: "Exclusive Resource Policy Access to Bucket"
description: "Access S3 bucket with exclusive resource policy that denies all except specific role"
cost_estimate: "$0/mo"
cost_estimate_when_demo_executed: "$0/mo"

# =============================================================================
# CLASSIFICATION
# =============================================================================
category: "Tool Testing"
sub_category: "edge-case-detection"
path_type: "multi-hop"
target: "to-bucket"
points: 10
environments:
  - "prod"

# =============================================================================
# ATTACK PATH
# =============================================================================
attack_path:
  principals:
    - "arn:aws:iam::{account_id}:user/pl-prod-erp-to-bucket-starting-user"
    - "arn:aws:iam::{account_id}:role/pl-exclusive-bucket-access-role"
    - "arn:aws:s3:::pl-exclusive-sensitive-data-{account_id}-{suffix}"

  summary: "starting_user → (sts:AssumeRole) → pl-exclusive-bucket-access-role → bucket access granted only by the bucket resource policy (the role's identity policy has just s3:ListAllMyBuckets; the policy denies everyone except the role and the Terraform deployer role)"

# =============================================================================
# PERMISSIONS
# =============================================================================
permissions:
  required:
    - principal: "pl-prod-erp-to-bucket-starting-user"
      principal_type: "user"
      permissions:
        - permission: "sts:AssumeRole"
          resource: "arn:aws:iam::*:role/pl-exclusive-bucket-access-role"

  helpful:
    - principal: "pl-prod-erp-to-bucket-starting-user"
      principal_type: "user"
      permissions:
        - permission: "iam:ListRoles"
          purpose: "Discover roles with exclusive bucket access"
        - permission: "s3:GetBucketPolicy"
          purpose: "View bucket resource policy"
# =============================================================================
# MITRE ATT&CK
# =============================================================================
mitre_attack:
  tactics:
    - "TA0004 - Privilege Escalation"
    - "TA0009 - Collection"
  techniques:
    - "T1078.004 - Valid Accounts: Cloud Accounts"
    - "T1530 - Data from Cloud Storage Object"

# =============================================================================
# TERRAFORM
# =============================================================================
terraform:
  variable_name: "enable_tool_testing_exclusive_resource_policy"
  module_path: "modules/scenarios/tool-testing/exclusive-resource-policy"
